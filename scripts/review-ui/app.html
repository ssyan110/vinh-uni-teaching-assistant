<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>教材審閱台 · Review Dashboard</title>
<style>
:root{color-scheme:light;--steel:#33566B;--steel-dark:#22333E;--steel-tint:#DEE9EF;--gold:#B08616;--gold-fill:#D9A521;--gold-tint:#F7EDCB;--paper:#F2F5F7;--card:#FDFEFE;--muted:#5A6B78;--border:rgba(51,86,107,.22);--red:#B04A3E;--red-tint:#F6E5E2;--green:#3E7A4E;--green-tint:#E2F0E5}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--paper);color:var(--steel-dark);min-height:100vh}
header{position:sticky;top:0;z-index:10;background:rgba(248,251,252,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--border);padding:14px 26px;display:flex;align-items:center;gap:14px}
header:before{content:"";position:fixed;left:0;top:0;bottom:0;width:8px;background:var(--steel)}
h1{font-size:19px;margin:0;font-weight:800}
h1 small{color:var(--gold);font-weight:800}
.crumb{color:var(--muted);font-size:14px;font-weight:600;cursor:pointer}
.crumb:hover{color:var(--steel)}
main{max-width:1200px;margin:0 auto;padding:26px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 20px;box-shadow:0 8px 22px rgba(34,51,62,.07);cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(34,51,62,.12)}
.card h2{font-size:17px;margin:0 0 4px;font-weight:800}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 10px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.05em;background:var(--steel-tint);color:var(--steel);text-transform:uppercase}
.tag.gold{background:var(--gold-tint);color:var(--gold)}
.meta{color:var(--muted);font-size:13px;margin:8px 0 12px}
.bar{height:8px;border-radius:999px;background:var(--steel-tint);overflow:hidden}
.bar i{display:block;height:100%;background:var(--steel);border-radius:999px}
.bar .done{background:var(--gold-fill)}
.barlabel{font-size:12px;color:var(--muted);margin-top:6px;font-weight:600}
.detail{display:grid;grid-template-columns:400px 1fr;gap:20px;align-items:start}
@media(max-width:980px){.detail{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 20px;box-shadow:0 8px 22px rgba(34,51,62,.07)}
.panel h3{margin:0 0 12px;font-size:15px;font-weight:800;color:var(--steel)}
.step{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:9px 10px;border-radius:12px;border:1px solid transparent}
.step:hover{background:var(--paper)}
.step .n{width:26px;height:26px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;background:var(--steel-tint);color:var(--steel)}
.step.approved .n{background:var(--green);color:#fff}
.step.auto-done .n{background:var(--steel);color:#fff}
.step.rejected .n{background:var(--red);color:#fff}
.step .name{font-size:14px;font-weight:700}
.step .sub{font-size:11px;color:var(--muted);font-weight:600}
.actions{display:flex;gap:6px}
button{font:inherit;font-size:12px;font-weight:800;border:1px solid var(--border);background:#fff;color:var(--steel);border-radius:999px;padding:4px 12px;cursor:pointer}
button:hover{background:var(--steel-tint)}
button.ok{border-color:var(--green);color:var(--green)}
button.ok:hover{background:var(--green-tint)}
button.no{border-color:var(--red);color:var(--red)}
button.no:hover{background:var(--red-tint)}
button.active-ok,button.active-ok:hover{background:var(--green);border-color:var(--green);color:#fff}
button.active-no,button.active-no:hover{background:var(--red);border-color:var(--red);color:#fff}
select{font:inherit;font-size:13px;font-weight:700;color:var(--steel-dark);border:1px solid var(--border);border-radius:10px;padding:6px 10px;background:#fff}
iframe{width:100%;aspect-ratio:16/10;border:1px solid var(--border);border-radius:14px;background:#fff}
.qa{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.qa img{width:100%;border-radius:10px;border:1px solid var(--border);display:block;cursor:zoom-in}
.rowline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.empty{color:var(--muted);font-size:14px;padding:30px;text-align:center}
a.plain{color:var(--steel);font-weight:700;font-size:13px}
.legend{font-size:11px;color:var(--muted);font-weight:600;margin-top:10px;line-height:1.6}
.toolbtns{display:flex;gap:8px;flex-wrap:wrap}
.toolbtns button{padding:8px 16px;font-size:13px;border-radius:12px}
.toolbtns button:disabled{opacity:.45;cursor:not-allowed}
.console{margin-top:12px;background:var(--steel-dark);color:#D8E4EC;border-radius:12px;padding:14px 16px;font:12px/1.55 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-all;max-height:320px;overflow:auto;display:none}
.console.show{display:block}
.jobstate{font-size:12px;font-weight:800;margin-left:auto}
.jobstate.running{color:var(--gold)}
.jobstate.done{color:var(--green)}
.jobstate.failed{color:var(--red)}
.newbtn{background:var(--steel);border-color:var(--steel);color:#fff;font-size:13px;padding:8px 18px;border-radius:12px}
.newbtn:hover{background:var(--steel-dark)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:14px}
.form label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:5px}
.form input,.form select{width:100%;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--steel-dark)}
.form .full{grid-column:1/-1}
.hint{font-size:11px;color:var(--muted);margin-top:4px}
@keyframes pulse{50%{opacity:.4}}
.running-dot{display:inline-block;width:8px;height:8px;border-radius:999px;background:var(--gold-fill);margin-right:6px;animation:pulse 1s infinite}
</style>
</head>
<body>
<header>
  <h1>教材審閱台 <small>· Review</small></h1>
  <span class="crumb" id="crumb" hidden>← 返回課程列表</span>
</header>
<main id="app"><div class="empty">載入中…</div></main>
<script>
const $ = (s, el=document) => el.querySelector(s);
let lessons = [], current = null;

async function api(path, opts) {
  const r = await fetch(path, opts ? { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(opts) } : undefined);
  if (!r.ok) throw new Error((await r.json()).error || r.status);
  return r.json();
}

function progress(l) {
  const auto = l.steps.filter(s=>s.status==='auto-done').length;
  return `<div class="bar"><i class="done" style="width:${(l.doneCount/18)*100}%"></i></div>
  <div class="barlabel">${l.doneCount}/18 完成 · ${l.approvedCount} 已核准 · ${auto} 自動偵測</div>`;
}

function renderList() {
  $('#crumb').hidden = true; current = null;
  const app = $('#app');
  if (!lessons.length) { app.innerHTML = '<div class="empty">找不到課程。請確認 output/ 目錄。</div>'; return; }
  app.innerHTML = `
  <div class="rowline" style="margin-bottom:16px">
    <button class="newbtn" onclick="togglePipelineForm()">＋ 新課程 · Pipeline 1–8</button>
  </div>
  <div class="panel" id="pipeform" style="display:none;margin-bottom:20px">
    <h3>新課程 · 執行 Pipeline 步驟 1–8</h3>
    <div class="form">
      <div><label>課程類型</label><select id="pf-type"><option value="regular">regular</option><option value="pinyin">pinyin</option><option value="auto">auto</option></select></div>
      <div><label>Lesson ID</label><input id="pf-id" placeholder="lesson-02 / pinyin-07"><div class="hint">決定輸出位置 output/book-1 或 output/pinyin</div></div>
      <div><label>課程標題</label><input id="pf-title" placeholder="第二课 · 你是哪国人？"></div>
      <div class="full"><label>教材 PDF（上傳）</label><input type="file" id="pf-pdf" accept=".pdf"><div class="hint">或直接填既有路徑：</div><input id="pf-pdf-path" placeholder="work/pdf-pages/ 或 Pinyin lessons/xxx.pdf" style="margin-top:6px"></div>
      <div class="full"><label>Content extract JSON（必填）</label><input id="pf-content" placeholder="work/lesson-02/extract.json"><div class="hint">run_pipeline.py 需要抽取內容檔；先由 agent 產出 extract.json 再執行</div></div>
      <div class="full"><button class="newbtn" onclick="runPipeline()">執行 Pipeline</button></div>
    </div>
    <div class="console" id="pipe-console"></div>
  </div>
  <div class="grid">` + lessons.map(l => `
    <div class="card" onclick="openLesson('${l.id}')">
      <div class="rowline" style="margin-bottom:6px">
        <span class="tag ${l.type==='pinyin'?'gold':''}">${l.type}</span>
        <span class="tag" style="background:transparent;border:1px solid var(--border)">${l.style}</span>
      </div>
      <h2>${l.title}</h2>
      <div class="meta">${l.slideCount} 張投影片 · ${l.dbFiles} 個資料庫檔${l.hasPresenter?' · presenter ✓':''}</div>
      ${progress(l)}
    </div>`).join('') + `</div>`;
}

function renderDetail(l) {
  current = l; $('#crumb').hidden = false;
  const stepRow = s => {
    const cls = s.status.replace('auto-done','auto-done');
    const label = {approved:'已核准', rejected:'退回', 'auto-done':'自動偵測完成', pending:'待處理'}[s.status];
    return `<div class="step ${cls}">
      <span class="n">${s.n}</span>
      <span><span class="name">${s.name}</span><br><span class="sub">${label}${s.updatedAt?' · '+s.updatedAt.slice(0,10):''}</span></span>
      <span class="actions">
        <button class="ok ${s.status==='approved'?'active-ok':''}" onclick="setStep(${s.n},'${s.status==='approved'?'pending':'approved'}')">${s.status==='approved'?'✓ 已核准':'核准'}</button>
        <button class="no ${s.status==='rejected'?'active-no':''}" onclick="setStep(${s.n},'${s.status==='rejected'?'pending':'rejected'}')">${s.status==='rejected'?'✗ 已退回':'退回'}</button>
      </span>
    </div>`;
  };
  $('#app').innerHTML = `
  <div class="rowline">
    <span class="tag ${l.type==='pinyin'?'gold':''}">${l.type}</span>
    <h2 style="margin:0;font-size:22px">${l.title}</h2>
    <span style="flex:1"></span>
    <label style="font-size:13px;font-weight:700;color:var(--muted)">風格
      <select onchange="setStyle(this.value)">
        ${['slate-citrus','coral-studio','original'].map(s=>`<option ${l.style===s?'selected':''}>${s}</option>`).join('')}
      </select>
    </label>
    ${l.presenterUrl?`<a class="plain" href="${l.presenterUrl}" target="_blank">開新視窗放映 ↗</a>`:''}
  </div>
  <div class="detail">
    <div class="panel">
      <h3>審閱進度 · 18 步</h3>
      ${progress(l)}<div style="height:10px"></div>
      ${l.steps.map(stepRow).join('')}
      <div class="legend">步驟 1–8 由資料庫產出自動偵測；9–18 需教師核准。「核准」再點一次可還原為待處理。狀態存於 review-status.json。</div>
    </div>
    <div>
      <div class="panel">
        <div class="rowline" style="margin-bottom:8px"><h3 style="margin:0">工具</h3><span class="jobstate" id="jobstate"></span></div>
        <div class="toolbtns" id="toolbtns">
          <button onclick="runTask('presenter')">同步 Presenter</button>
          <button onclick="runTask('assets-manifest')">資產清單</button>
          <button onclick="runTask('assets-qa')">資產 QA</button>
          <button onclick="if(confirm('簡報設計與內容已定稿？PDF 為備份匯出。'))runTask('pdf')">匯出 PDF</button>
        </div>
        <div class="console" id="task-console"></div>
      </div>
      <div class="panel" style="margin-top:20px">
        <h3>簡報預覽</h3>
        ${l.presenterUrl?`<iframe src="${l.presenterUrl}"></iframe>`:'<div class="empty">尚無 presenter</div>'}
      </div>
      ${l.qa.length?`<div class="panel" style="margin-top:20px"><h3>QA 截圖</h3><div class="qa">${l.qa.map(q=>`<a href="/files/${q}" target="_blank"><img src="/files/${q}" loading="lazy"></a>`).join('')}</div></div>`:''}
    </div>
  </div>`;
}

// ---- Job execution & log streaming (polling) ----
let pollTimer = null;
function watchJob(jobId, consoleEl, stateEl, onDone) {
  clearInterval(pollTimer);
  consoleEl.classList.add('show');
  consoleEl.textContent = '';
  let offset = 0;
  const tick = async () => {
    try {
      const j = await api(`/api/jobs/${jobId}?offset=${offset}`);
      if (j.logChunk) {
        consoleEl.textContent += j.logChunk;
        offset = j.logLength;
        consoleEl.scrollTop = consoleEl.scrollHeight;
      }
      if (stateEl) stateEl.innerHTML = j.status === 'running'
        ? '<span class="running-dot"></span>執行中'
        : (j.status === 'done' ? '✓ 完成' : '✗ 失敗');
      if (stateEl) stateEl.className = 'jobstate ' + j.status;
      if (j.status !== 'running') { clearInterval(pollTimer); onDone && onDone(j); }
    } catch (e) { clearInterval(pollTimer); consoleEl.textContent += '\n[poll error] ' + e.message; }
  };
  tick();
  pollTimer = setInterval(tick, 800);
}

window.runTask = async (task) => {
  const btns = document.querySelectorAll('#toolbtns button');
  btns.forEach(b => b.disabled = true);
  try {
    const { jobId } = await api(`/api/lessons/${current.id}/run`, { task });
    watchJob(jobId, $('#task-console'), $('#jobstate'), async () => {
      btns.forEach(b => b.disabled = false);
      lessons = await api('/api/lessons');
      const l = lessons.find(x => x.id === current.id);
      if (l) current = l;
    });
  } catch (e) {
    btns.forEach(b => b.disabled = false);
    alert(e.message);
  }
};

window.togglePipelineForm = () => {
  const f = $('#pipeform');
  f.style.display = f.style.display === 'none' ? 'block' : 'none';
};

window.runPipeline = async () => {
  try {
    let sourcePdf = $('#pf-pdf-path').value.trim();
    const file = $('#pf-pdf').files[0];
    if (file) {
      const up = await fetch(`/api/upload?name=${encodeURIComponent(file.name)}`, { method: 'POST', body: file });
      if (!up.ok) throw new Error((await up.json()).error || '上傳失敗');
      sourcePdf = (await up.json()).path;
    }
    if (!sourcePdf) throw new Error('請上傳 PDF 或填 PDF 路徑');
    const { jobId } = await api('/api/pipeline', {
      lessonType: $('#pf-type').value,
      lessonId: $('#pf-id').value.trim(),
      lessonTitle: $('#pf-title').value.trim(),
      sourcePdf,
      contentFile: $('#pf-content').value.trim(),
    });
    watchJob(jobId, $('#pipe-console'), null, async (j) => {
      if (j.status === 'done') { lessons = await api('/api/lessons'); renderList(); $('#pipeform').style.display='block'; $('#pipe-console').classList.add('show'); $('#pipe-console').textContent='✓ Pipeline 完成，課程列表已更新。'; }
    });
  } catch (e) { alert(e.message); }
};

window.openLesson = async (id) => { renderDetail(lessons.find(l=>l.id===id)); };
window.setStep = async (n, status) => {
  const updated = await api(`/api/lessons/${current.id}/steps/${n}`, { status });
  lessons = lessons.map(l => l.id===updated.id ? updated : l);
  renderDetail(updated);
};
window.setStyle = async (style) => {
  const updated = await api(`/api/lessons/${current.id}/style`, { style });
  lessons = lessons.map(l => l.id===updated.id ? updated : l);
  renderDetail(updated);
};
$('#crumb').onclick = renderList;

api('/api/lessons').then(d => { lessons = d; renderList(); })
  .catch(e => { $('#app').innerHTML = `<div class="empty">載入失敗：${e.message}</div>`; });
</script>
</body>
</html>
