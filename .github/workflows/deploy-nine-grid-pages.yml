name: Deploy nine-grid classroom game

on:
  push:
    branches: [main]
    paths:
      - "classroom-tools/nine-grid-lesson-01/**"
      - ".github/workflows/deploy-nine-grid-pages.yml"
      - "classroom-tools/speaking-challenge/exam/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: classroom-tools/nine-grid-lesson-01
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: classroom-tools/nine-grid-lesson-01/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run validate-content
      - run: npm run validate-offline
      - name: Check oral-practice timer
        run: node --test ../speaking-challenge/exam/test-logic.mjs
      - name: Include student oral self-practice
        run: |
          mkdir -p dist/oral-practice/assets
          cp ../speaking-challenge/exam/{index.html,styles.css,app.js,logic.js,content.js} dist/oral-practice/
          cp ../speaking-challenge/exam/assets/B*.webp dist/oral-practice/assets/
      - name: Include student speaking practice guide
        run: |
          mkdir -p dist/speaking-practice
          cp site/speaking-practice/index.html dist/speaking-practice/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: classroom-tools/nine-grid-lesson-01/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
