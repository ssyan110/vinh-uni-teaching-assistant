name: Deploy nine-grid classroom game
on:
  push:
    branches: [main]
    paths:
      - "classroom-tools/nine-grid-lesson-01/**"
      - ".github/workflows/deploy-nine-grid-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: classroom-tools/nine-grid-lesson-01
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: classroom-tools/nine-grid-lesson-01/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run validate-content
      - run: npm run validate-offline
      - uses: actions/upload-pages-artifact@v3
        with:
          path: classroom-tools/nine-grid-lesson-01/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
