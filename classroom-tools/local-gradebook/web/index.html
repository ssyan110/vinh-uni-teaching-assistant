<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>榮市大學 · 教师评分</title><link rel="stylesheet" href="/style.css"><script defer src="/queue.js"></script><script defer src="/app.js"></script><script defer src="/feedback.js"></script></head><body><header><div><strong>榮市大學 · 教师评分</strong><small>本机单人使用</small></div><nav aria-label="页面"><button data-view="score" class="active">评分</button><button data-view="overview">成绩总览</button><button data-view="backup">备份与恢复</button></nav></header><main><div id="message" role="status" aria-live="polite"></div><div class="toolbar"><label>班级<select id="class-select"></select></label><label id="assessment-label">考试<select id="assessment-select"></select></label><button id="new-assessment">＋ 新增考试</button><details class="exam-tools"><summary>考试设置</summary><div><button id="individual-feedback">个人反馈</button><button id="edit-assessment">编辑考试</button><button id="refresh">重新载入</button><a id="export" class="button" href="#">导出本班 Excel</a></div></details></div><div id="content"><p>正在读取本机资料…</p></div></main><dialog id="assessment-dialog"><form id="assessment-form"><h2 id="assessment-dialog-title">新增考试</h2><div id="form-error" role="alert"></div><p id="assessment-help"></p><label>考试名称<input id="assessment-title" required maxlength="300" placeholder="例如：第一课个人报告／课外访谈"></label><label>日期<input id="assessment-date" type="date"></label><label>考试内容<select id="source-type"><option value="textbook">教材课次</option><option value="extra">课外口语活动</option></select></label><div id="textbook-fields"><label>教材<select id="textbook-select"></select></label><fieldset class="lesson-field"><legend>考哪一课（可勾选多课）</legend><div id="lesson-select" class="lesson-choices"></div></fieldset></div><label id="activity-field" hidden>课外活动名称<input id="activity-name" maxlength="300" placeholder="例如：校园采访／自由主题报告"></label><label>本次任务要求<textarea id="assessment-instructions" rows="3" placeholder="评分时显示在学生姓名下方"></textarea></label><label>评分方式<select id="rubric-mode"><option value="total">总分 10 分（自行判断）</option><option value="five">五项评分（3＋2＋2＋2＋1）</option><option value="custom">自定义分项</option></select></label><div id="custom-rubric" hidden><p>填写每项名称和满分，评分按半分计。</p><div id="rubric-rows"></div><button id="add-criterion" type="button">＋ 添加评分项目</button></div><p class="muted">每次考试保存自己的评分标准。已有评分的考试只能改名称、日期、内容标记和任务说明；更换标准请新增考试。</p><div class="actions"><button type="button" id="cancel-assessment">取消</button><button id="submit-assessment" class="primary" type="submit">建立考试</button></div></form></dialog><dialog id="history-dialog"><h2>这条记录的修改历史</h2><div id="history-content"></div><button id="close-history">关闭</button></dialog></body></html>
