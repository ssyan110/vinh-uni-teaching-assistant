<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教學任務搜尋</title><style>
:root{color-scheme:light;color:#17324d;background:#f4f7f8;font-family:'Times New Roman',KaiTi,serif}*{box-sizing:border-box}body{margin:0}main{max-width:1120px;margin:auto;padding:28px}h1{margin:0;font-size:32px}h2{overflow-wrap:anywhere;font-size:23px;margin:8px 0}p{line-height:1.65}header{margin-bottom:22px}.filters{background:#fff;border:1px solid #d8e2e6;border-radius:12px;padding:20px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}label{display:block;font-size:17px}input,select,button{font:inherit;font-size:17px;padding:11px;width:100%;margin-top:6px;border:1px solid #aabcc6;border-radius:6px;background:white;color:#17324d}input:focus,select:focus,button:focus,a:focus{outline:3px solid #4a9a9a;outline-offset:2px}#results{display:grid;gap:16px}article{background:white;border:1px solid #d8e2e6;border-radius:12px;padding:20px}.badge{display:inline-block;background:#fff0d4;border-radius:5px;padding:5px 9px;font-size:16px}.meta{font-size:15px;color:#456070;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;font:17px 'Times New Roman',KaiTi,serif}summary{cursor:pointer;padding:12px 0}a{color:#20676c}button{cursor:pointer;width:auto;background:#e8f3f1}.notice{padding:12px 16px;background:#e8f3f1;border-radius:8px}dialog{max-width:900px;width:90%;max-height:85vh;border:1px solid #9cb4c1;border-radius:12px}dialog::backdrop{background:#17324d88}#error{color:#a33225}@media(max-width:650px){main{padding:18px}.filters{grid-template-columns:1fr}h1{font-size:28px}article{padding:16px}}
</style><main><header><p>教師備課工具</p><h1>教學任務搜尋</h1><p>從專案現有內容找任務，查看原始指令、材料與來源狀態。</p></header>
<form class="filters" id="filters"><label>教材<select id="book"></select></label><label>指定課次<select id="lesson"><option value="">範圍內全部課次</option></select></label><label>目前已教到第幾課<input id="current" type="number" min="1" max="99" value="1" required></label><label>目前課次已完成的階段<select id="stage"><option value="0">剛開始本課</option><option value="1">聽說（一）口語句式</option><option value="2">聽說（二）進行中</option><option value="3" selected>已完成本課</option></select></label><label>關鍵字<input id="q" type="search" placeholder="例如：同伴、生日、姓名"></label><label>所需材料包含<input id="material" type="search" placeholder="例如：預習卡、記錄表"></label></form>
<p class="notice">範圍包含目前課次；前面各課視為已完成。目前課次只顯示已完成階段可用的任務。未標明階段的設計草案，完成本課後才列出。來源引文保留原用字，請先核對草案再用於課堂。</p>
<p id="count" role="status" aria-live="polite"></p><p id="error" role="alert"></p><section id="results" aria-label="搜尋結果"></section>
<dialog id="preview"><button id="close">關閉來源</button><h2 id="source-title"></h2><p id="source-hash" class="meta"></p><pre id="source-text"></pre></dialog></main>
<script>
const $=s=>document.getElementById(s); let catalog;let request=0;
function node(tag,text,cls){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;return el;}
async function get(url){const r=await fetch(url);if(!r.ok)throw Error('無法讀取來源，請確認本機伺服器仍在執行。');return r.json();}
function lessonOptions(){const book=$('book').value;$('lesson').replaceChildren(new Option('範圍內全部課次',''));for(const l of catalog.lessons.filter(l=>l.textbook_id===book).sort((a,b)=>a.lesson_number-b.lesson_number))$('lesson').add(new Option(`${l.lesson_id} ${l.title}`,l.lesson_key));}
async function showSource(id){try{const s=await get('/api/source?id='+encodeURIComponent(id));$('source-title').textContent=s.path;$('source-hash').textContent='SHA-256 '+s.sha256;$('source-text').textContent=s.text;$('preview').showModal();}catch(e){$('error').textContent=e.message;}}
async function render(){const seq=++request;const p=new URLSearchParams();for(const k of ['book','lesson','current','stage','q','material'])p.set(k,$(k).value);try{const tasks=await get('/api/search?'+p);if(seq!==request)return;$('error').textContent='';$('results').replaceChildren();$('count').textContent=`找到 ${tasks.length} 個任務；索引目前共 ${catalog.tasks.length} 個。`;if(!tasks.length){$('results').append(node('p','目前條件沒有任務。可清除關鍵字、材料條件，或查看已教課次與階段。'));return;}for(const t of tasks){const card=node('article');card.append(node('span',t.status,'badge'),node('h2',t.title),node('p',t.lesson_key+' · '+t.lesson_title,'meta'),node('p','可用階段：'+t.stage_label));const d=node('details');d.append(node('summary','查看原始任務指令'),node('pre',t.instructions));card.append(d);if(t.outcome)card.append(node('p','來源列出的產出／目標：'+t.outcome));card.append(node('p','材料：'+(t.materials||'來源未列出')),node('p',t.printed_pages?'教材印刷頁：'+t.printed_pages+'（課次範圍；任務頁碼見來源）':'教材印刷頁：來源未登記，不推定頁碼','meta'),node('p','登記狀態：'+JSON.stringify(t.source_status),'meta'));const a=node('a','查看教師來源原文');a.href='/api/source?id='+t.source_id;a.addEventListener('click',e=>{e.preventDefault();showSource(t.source_id)});card.append(a,node('p',t.source_path,'meta'));$('results').append(card);}}catch(e){$('error').textContent=e.message;$('count').textContent='搜尋未完成';}}
$('close').onclick=()=>$('preview').close();$('filters').onsubmit=e=>{e.preventDefault();render()};$('filters').addEventListener('input',render);$('book').addEventListener('change',()=>{lessonOptions();render()});
get('/api/catalog').then(d=>{catalog=d;for(const b of d.books)$('book').add(new Option(b.title+(b.textbook_id==='boya-intermediate-i'?'（2027 規劃教材）':''),b.textbook_id));$('book').value='boya-quasi-intermediate-i';$('current').value='3';lessonOptions();render();}).catch(e=>$('error').textContent=e.message);
</script></html>
