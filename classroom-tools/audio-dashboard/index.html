<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>榮市大学 · 测验与音频中心</title>
<style>
:root{--navy:#17324d;--teal:#176b6c;--line:#d6e0e4;--paper:#fff;--muted:#546b78}*{box-sizing:border-box}body{margin:0;background:#f3f6f7;color:var(--navy);font-family:"Times New Roman",KaiTi,serif;font-size:19px}header{background:var(--navy);color:white;padding:30px max(24px,calc((100vw - 1180px)/2))}header p{margin:8px 0 0;color:#d5e4e9}h1{margin:0;font-size:34px;font-weight:normal}main{max-width:1228px;padding:24px;margin:auto}.filters{background:white;border:1px solid var(--line);padding:22px;margin-bottom:22px}.selects{display:grid;grid-template-columns:1fr 1fr;gap:24px}label{display:block}select{display:block;width:100%;margin:9px 0 18px;padding:12px;font:inherit;color:inherit;border:1px solid #9bb0bb;background:white;border-radius:4px}fieldset{border:0;padding:0;margin:0}legend{margin-bottom:12px}.lessons{display:flex;flex-wrap:wrap;gap:8px}.lesson{padding:9px 14px;border:1px solid var(--line);border-radius:4px;cursor:pointer}.lesson:has(input:checked){background:#e7f4f1;border-color:var(--teal)}input{accent-color:var(--teal)}button,a{font:inherit}button{padding:11px 18px;background:white;color:var(--navy);border:1px solid #a8bac4;border-radius:4px;cursor:pointer}button:disabled{opacity:.4;cursor:default}button.primary{background:var(--teal);color:white;border-color:var(--teal)}button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #ce8a2d;outline-offset:3px}.layout{display:grid;grid-template-columns:370px 1fr;gap:24px;align-items:start}.player{position:sticky;top:20px;background:white;border-top:5px solid var(--teal);padding:25px}.eyebrow{font-size:16px;color:var(--muted)}h2{font-size:29px;font-weight:normal;margin:15px 0}audio{width:100%;margin:16px 0}.controls{display:flex;flex-wrap:wrap;gap:8px}.controls button{flex:1;white-space:nowrap;padding:11px 10px}#status{min-height:26px;color:var(--teal)}#error{color:#a02626}#queue{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}#queue li{border-bottom:1px solid var(--line)}.track{width:100%;text-align:left;border:0;border-radius:0;display:grid;grid-template-columns:38px 1fr auto;gap:12px;padding:17px;background:white}.track:hover{background:#eef5f4}.track[aria-current=true]{background:#e1f1ed;box-shadow:inset 4px 0 var(--teal)}.track small{display:block;color:var(--muted);margin-top:6px;font-size:16px}.number{color:var(--teal)}.hint{color:var(--muted);line-height:1.6;font-size:17px}#exam-link{display:inline-block;color:var(--teal);margin-top:14px}.queue-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.queue-header h2{margin:0}footer{margin-top:25px;color:var(--muted);font-size:16px}@media(max-width:760px){.layout,.selects{grid-template-columns:1fr}.player{position:static}header{padding:24px}main{padding:15px}h1{font-size:29px}}
.track.played,.track.played:hover{background:#fff0cb}.track.played[aria-current=true]{box-shadow:inset 4px 0 var(--teal)}
.exam-entry{margin:20px 0 24px;background:white;border:1px solid var(--line);padding:22px;display:flex;align-items:center;gap:25px}.exam-entry[hidden],.exam-entry a[hidden]{display:none}.exam-entry img{width:160px;height:160px}.exam-entry h2{font-size:26px;margin:0 0 12px}.exam-entry a{color:var(--teal);display:inline-block;margin-right:16px}.exam-entry p{margin:10px 0}dialog{color:var(--navy);font:inherit;border:0;padding:24px;width:min(780px,95vw);max-height:95vh;text-align:center}dialog::backdrop{background:rgba(10,28,44,.85)}dialog img{display:block;width:min(60vh,100%);height:auto;margin:12px auto}dialog h2{font-size:30px}#close-qr{float:right}dialog p{clear:both}@media(max-width:600px){.exam-entry{align-items:flex-start;flex-direction:column}.exam-entry img{width:180px;height:180px}}
#queue .audio-group{border:0;margin-bottom:22px}#queue .audio-group h3{font-size:21px;font-weight:normal;margin:0;padding:14px 17px;background:#17324d;color:white;line-height:1.5}#queue .audio-group ol{list-style:none;margin:0;padding:0}.teacher-tools{margin-bottom:22px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.teacher-tools div{display:flex;flex-wrap:wrap;gap:10px}.teacher-tools a{background:white;border:1px solid var(--line);border-radius:4px;padding:11px 14px;color:var(--navy);text-decoration:none}.teacher-tools a:hover{background:#e7f4f1}.teacher-tools a[hidden]{display:none}#management-link{background:var(--teal);color:white}#exam-link[hidden]{display:none}</style></head><body><header><div class="eyebrow" style="color:#c3d7dd">VINH UNIVERSITY / TEACHER AUDIO</div><h1>测验与音频中心</h1><p>选择教材与周次，在这里开启测验、播放音频、管理题库和作答。</p></header><main>
<nav class="teacher-tools" aria-label="教师管理入口"><a id="management-link" target="_blank" rel="noopener">综合管理总表</a><div id="teacher-links"></div></nav><section class="filters" aria-label="音频选择"><div class="selects"><label>教材<select id="book"></select></label><label>周次／播放清单<select id="set"></select></label></div><fieldset><legend>本次播放的课次</legend><div id="lessons" class="lessons"></div></fieldset><p id="set-status" class="hint"></p></section>
<section id="exam-entry" class="exam-entry" aria-label="测验开启台" hidden><img id="exam-qr" alt="学生作答二维码"><div><h2 id="exam-title"></h2><p id="exam-state"></p><p class="hint">学生扫描此码进入本卷。课次勾选只筛选音频，不会改变测验题目。</p><a id="student-link" target="_blank" rel="noopener">打开学生作答页</a><button id="show-qr" class="primary">放大二维码／投影</button></div></section><p id="no-exam" class="hint">此清单尚未登记学生作答入口。</p><dialog id="exam-dialog" aria-labelledby="qr-title"><button id="close-qr">关闭</button><h2 id="qr-title"></h2><img id="large-qr" alt="学生作答二维码放大图"><p id="qr-state"></p></dialog><div class="layout"><section class="player" aria-label="播放器"><div class="eyebrow">当前音段</div><h2 id="title">选择音段</h2><p id="detail"></p><audio id="audio" controls preload="metadata"></audio><div class="controls"><button id="prev">上一段</button><button id="play" class="primary">从头播放</button><button id="next">下一段</button></div><p id="status" role="status" aria-live="polite">准备播放</p><p id="error" role="alert"></p><p class="hint">点击列表直接播放。上一段／下一段只切换音段，便于先看题；播放结束后由你决定重听或继续。</p><a id="exam-link" hidden>打开本卷完整主持页面（遍数与计时）</a></section><section aria-label="播放清单"><div class="queue-header"><h2>播放清单</h2><span id="count"></span></div><ol id="queue"></ol><p id="empty" class="hint" hidden>没有可用音段，请选择其他课次或清单。</p></section></div><footer>榮市大学华语听说 · 教师使用</footer></main><script src="catalog.js"></script><script src="player.js"></script></body></html>
