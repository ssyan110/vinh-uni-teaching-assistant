<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>荣市大学 · 测验与音频中心</title>
<link rel="stylesheet" href="dashboard.css?v=20261104-consistency"></head><body><header><div class="eyebrow" style="color:#c3d7dd">VINH UNIVERSITY / TEACHER AUDIO</div><h1>测验与音频中心</h1><p>选择教材与周次，在这里开启测验、播放音频、管理题库和作答。</p></header><main>
<section class="filters" aria-label="音频选择"><div class="selects"><label>教材<select id="book"></select></label><label>周次／播放清单<select id="set"></select></label></div><fieldset><legend>本次播放的课次</legend><div id="lessons" class="lessons"></div></fieldset><p id="set-status" class="hint"></p></section><section class="management" aria-label="当前清单管理"><nav id="teacher-links" class="teacher-tools" aria-label="教师管理入口"></nav><p id="tools-status" class="hint"></p><div id="extra-tools" class="teacher-tools" aria-label="其他教师入口"></div></section>
<section id="exam-entry" class="exam-entry" aria-label="测验开启台" hidden><img id="exam-qr" alt="学生作答二维码"><div><h2 id="exam-title"></h2><p id="exam-state"></p><p class="hint">学生扫描此码进入本卷。课次勾选只筛选音频，不会改变测验题目。</p><a id="student-link" target="_blank" rel="noopener">打开学生作答页</a><button id="show-qr" class="primary">放大二维码／投影</button></div></section><p id="no-exam" class="hint">此清单尚未登记学生作答入口。</p><dialog id="exam-dialog" aria-labelledby="qr-title"><button id="close-qr">关闭</button><h2 id="qr-title"></h2><img id="large-qr" alt="学生作答二维码放大图"><p id="qr-state"></p></dialog><div class="layout"><section class="player" aria-label="播放器"><div class="eyebrow">当前音频</div><h2 id="title">选择音频</h2><p id="detail"></p><audio id="audio" controls preload="metadata"></audio><div class="controls"><button id="prev">上一段</button><button id="play" class="primary">从头播放</button><button id="next">下一段</button></div><p id="status" role="status" aria-live="polite">准备播放</p><p id="error" role="alert"></p><p class="hint">点击列表中的音频即可播放。上一段／下一段只切换音频，便于先看题；播放结束后由你决定重听或继续。</p><p id="host-status" class="hint" hidden></p><a id="exam-link" hidden>打开本卷完整主持页面（遍数与计时）</a></section><section aria-label="播放清单"><div class="queue-header"><h2>播放清单</h2><span id="count"></span></div><ol id="queue"></ol><p id="empty" class="hint" hidden>没有可用音频，请选择其他课次或清单。</p></section></div><footer>荣市大学华语听说 · 教师使用</footer></main><script src="catalog.js?v=20261104-y2-w09"></script><script src="closeout-data.js?v=8cb1116f7d58"></script><script src="ui.js?v=20261104-consistency"></script><script src="player.js?v=20261104-consistency"></script></body></html>
