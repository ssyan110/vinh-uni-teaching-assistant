<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f5f5f7">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'">
  <meta name="description" content="自己抽题、看图、说中文。问题和六格图片同时显示，准备1分钟，再用2分钟练习回答。">
  <title>口语练习｜问题与图片</title>
  <link rel="stylesheet" href="styles.css?v=20261026-sixgrid1">
  <script defer src="content.js?v=20261026-sixgrid1"></script>
  <script defer src="logic.js?v=20261026-skipcontrols"></script>
  <script defer src="app.js?v=20261026-sixgrid1"></script>
</head>
<body>
  <main class="exam-shell">
    <header class="exam-header">
      <div class="heading-block">
        <p class="eyebrow">荣市大学 · 华语听说课</p>
        <h1>口语练习</h1>
      </div>
      <p class="exam-format">准备 1 分钟 <span aria-hidden="true">·</span> 回答 2 分钟</p>
    </header>

    <section class="control-bar" aria-label="抽题与计时控制">
      <button class="primary-button" id="mainAction" type="button" disabled>载入题目中…</button>
      <div class="timer-panel" id="timerPanel">
        <span class="phase-label" id="phaseLabel">等待抽题</span>
        <div class="timer" id="timer" role="timer" aria-label="剩余时间">—:—</div>
      </div>
      <button class="pause-button" id="pauseAction" type="button" hidden>暂停</button>
      <button class="skip-button" id="skipAction" type="button" hidden>跳过准备</button>
    </section>
    <p class="exam-status" id="examStatus" role="status" aria-live="polite">正在检查题目和图片…</p>

    <section class="exam-grid" aria-label="抽到的题目和图片">
      <article class="exam-card question-card" aria-labelledby="questionHeading">
        <header class="card-heading">
          <h2 id="questionHeading"><span class="part-number">01</span> 回答问题</h2>
          <span class="item-tag" id="questionTag">问题 —</span>
        </header>
        <div class="question-body" id="questionCardBody">
          <p class="draw-placeholder">问题将在抽题后显示</p>
        </div>
      </article>

      <article class="exam-card picture-card" aria-labelledby="pictureHeading">
        <header class="card-heading">
          <div class="picture-heading-copy">
            <h2 id="pictureHeading"><span class="part-number">02</span> 看图叙事</h2>
            <p class="picture-cue" id="pictureCue"></p>
          </div>
          <div class="picture-actions">
            <span class="item-tag" id="pictureTag">图片 —</span>
            <button class="zoom-button" id="zoomPicture" type="button" hidden>放大</button>
          </div>
        </header>
        <div class="picture-body" id="pictureCardBody">
          <div class="draw-placeholder picture-placeholder">图片将在抽题后显示</div>
        </div>
      </article>
    </section>

  </main>
  <dialog class="picture-dialog" id="pictureDialog" aria-labelledby="pictureDialogTitle">
    <div class="dialog-heading">
      <h2 id="pictureDialogTitle">看图叙事</h2>
      <button class="zoom-button" id="closePicture" type="button">关闭</button>
    </div>
    <p class="dialog-hint">左右滑动看六格</p>
    <div class="dialog-scroll"><img id="largePicture" alt=""></div>
  </dialog>
</body>
</html>
