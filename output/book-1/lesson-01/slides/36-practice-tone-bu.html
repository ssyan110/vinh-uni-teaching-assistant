<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=960,height=540"><title>Luyện thanh điệu của 不</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet"><script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script><link rel="stylesheet" href="assets/slide-base.css"><style>
.practice-title{position:absolute;left:0;right:0;top:72px;text-align:center;font-size:25pt;font-weight:800}
.practice-sub{position:absolute;left:0;right:0;top:118px;text-align:center;font-size:13pt;color:#8A9AB0}
.practice-hint{position:absolute;left:0;right:0;top:148px;text-align:center;font-size:11pt;color:#B0BEC5;font-style:italic}

.neg-grid{position:absolute;left:110px;right:110px;top:200px;display:flex;justify-content:center;gap:34px}
.neg-card{width:210px;height:220px;text-align:center;padding:28px 18px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.neg-card .hanzi{font-size:42pt;line-height:1.1}
.neg-card .viet{font-size:13pt;color:#4A6080;margin-top:6px}
.neg-card .pinyin-row{margin-top:14px;font-size:15pt;display:flex;align-items:baseline;justify-content:center;gap:4px}
.neg-card .pinyin-bu-wrap{position:relative;display:inline-block;color:#5AACAC;font-weight:600}
.neg-card .pinyin-bu-notone{color:#5AACAC;font-weight:600;transition:opacity .3s ease}
.neg-card .pinyin-bu-toned{position:absolute;left:0;top:0;color:#E05A5A;font-weight:700;opacity:0;transition:opacity .3s ease;white-space:nowrap}
.neg-card.revealed .pinyin-bu-toned{opacity:1}
.neg-card.revealed .pinyin-bu-notone{opacity:0}
.neg-card .pinyin-char2{color:#5AACAC;font-weight:600}
</style></head><body><div class="slide"><div class="menu-bar"><span class="menu-icon"><i data-lucide="pencil"></i></span><span class="section-label">TẬP TỪ VỰNG</span></div>
    <div class="practice-title">Biến điệu của 不</div>
    <div class="practice-sub">Nhìn từ → đoán thanh điệu của 不 → click kiểm tra</div>
    <div class="practice-hint">不 + thanh 4 → bú &nbsp;|&nbsp; 不 + thanh khác → bù</div>
    <div class="neg-grid">
      <div class="neg-card card" data-reveal-step="1">
        <div class="hanzi">不好</div>
        <div class="viet">không tốt</div>
        <div class="pinyin-row">
          <span class="pinyin-bu-wrap">
            <span class="pinyin-bu-notone">bu</span>
            <span class="pinyin-bu-toned">bù</span>
          </span>
          <span class="pinyin-char2">hǎo</span>
        </div>
      </div>
      <div class="neg-card card" data-reveal-step="2">
        <div class="hanzi">不大</div>
        <div class="viet">không lớn</div>
        <div class="pinyin-row">
          <span class="pinyin-bu-wrap">
            <span class="pinyin-bu-notone">bu</span>
            <span class="pinyin-bu-toned">bú</span>
          </span>
          <span class="pinyin-char2">dà</span>
        </div>
      </div>
      <div class="neg-card card" data-reveal-step="3">
        <div class="hanzi">不白</div>
        <div class="viet">không trắng</div>
        <div class="pinyin-row">
          <span class="pinyin-bu-wrap">
            <span class="pinyin-bu-notone">bu</span>
            <span class="pinyin-bu-toned">bù</span>
          </span>
          <span class="pinyin-char2">bái</span>
        </div>
      </div>
    </div>
  </div><script src="assets/slide-base.js"></script></body></html>
