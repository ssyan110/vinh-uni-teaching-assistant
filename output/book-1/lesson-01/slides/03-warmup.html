<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=960,height=540"><title>Khởi động</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet"><script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script><link rel="stylesheet" href="assets/slide-base.css"><style>
.slide{background:linear-gradient(to top,#F4FAFA,#FFFFFF)}.warm-main{position:absolute;left:58px;top:78px;width:488px;height:360px;padding:32px 38px}.warm-kicker{font-size:10pt;color:#5AACAC;font-weight:800;text-transform:uppercase;letter-spacing:1.6px;margin-bottom:13px}.warm-question{font-size:27pt;line-height:1.13;font-weight:800;color:#1A3A5A;letter-spacing:0}.warm-hint{font-size:14pt;color:#8A9AB0;margin-top:14px}.tag-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px;width:100%}.tag-item{background:rgba(248,251,251,.92);border:1.5px solid rgba(90,172,172,.22);border-radius:14px;padding:10px 8px 9px;font-size:9.3pt;font-weight:750;color:#5A748E;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;min-height:76px;box-shadow:0 4px 12px rgba(90,172,172,.07)}.tag-sketch{width:42px;height:34px}.tag-sketch path,.tag-sketch circle,.tag-sketch rect,.tag-sketch line,.tag-sketch polyline{stroke:#7893A5;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none}.tag-sketch .fill{fill:#E7F4F2;stroke:#7893A5}.tag-sketch .soft{fill:#F7E7C8;stroke:#7893A5}.warm-photo-large{position:absolute;right:58px;top:92px;width:304px;height:214px}.warm-prompts{position:absolute;right:58px;top:324px;width:304px;display:grid;grid-template-columns:1fr;gap:10px}.mini-prompt{height:42px;padding:8px 12px;display:flex;align-items:center;gap:10px;font-size:11pt;color:#4A6080}.mini-prompt span{width:24px;height:24px;border-radius:50%;background:#5AACAC;color:#fff;font-size:9pt;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
</style></head><body><div class="slide"><div class="menu-bar"><span class="menu-icon"><i data-lucide="map-pin"></i></span><span class="section-label">KHỞI ĐỘNG</span></div>

      </div>
    </div>

    <div class="warm-prompts">

    </div>
  </div><script src="assets/slide-base.js"></script></body></html>
