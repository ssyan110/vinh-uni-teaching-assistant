<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=960,height=540"><title>Tổng kết từ vựng</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet"><script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script><link rel="stylesheet" href="assets/slide-base.css"><style>

</style></head><body><div class="slide"><div class="menu-bar"><span class="menu-icon char">文</span><span class="section-label">TỪ VỰNG</span></div><div class="page-indicator">Trang 1-2</div>
