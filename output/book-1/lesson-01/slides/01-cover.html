<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=960,height=540">
  <title>Bài 1 · 你好</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="assets/slide-base.css">
  <style>
    .aligned-text {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 12px;
      row-gap: 7px;
      flex-wrap: wrap;
      overflow: visible;
    }

    .aligned-text .a-word {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      min-height: 76px;
      overflow: visible;
    }

    .aligned-text .a-pin {
      font-size: 13.5pt;
      line-height: 1.05;
      color: #5AACAC;
      font-weight: 800;
      white-space: nowrap;
      margin-bottom: 7px;
    }

    .aligned-text .a-han {
      font-family: 'Noto Sans SC';
      font-size: 36pt;
      line-height: 1;
      color: #1A3A5A;
      font-weight: 900;
      white-space: nowrap;
    }

    body {
      background: #fff;
    }

    .cover {
      position: absolute;
      inset: 0;
      background: linear-gradient(145deg, #F4FAFA 0%, #FFFFFF 56%, #F3F0FA 100%);
      overflow: hidden;
    }

    .cover:before {
      content: "";
      position: absolute;
      right: -80px;
      top: -120px;
      width: 360px;
      height: 360px;
      border-radius: 50%;
      background: rgba(90, 172, 172, .13);
    }

    .cover-card {
      position: absolute;
      left: 62px;
      top: 78px;
      width: 520px;
      z-index: 2;
    }

    .lesson {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #E8F4F4;
      color: #5AACAC;
      padding: 8px 16px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 12pt;
    }

    .cover-align {
      justify-content: flex-start;
      gap: 14px;
      margin-top: 26px;
    }

    .cover-align .a-word {
      min-height: 88px;
    }

    .cover-align .a-pin {
      font-size: 16pt;
    }

    .cover-align .a-han {
      font-size: 62pt;
    }

    .vi {
      font-size: 24pt;
      color: #4A6080;
      font-weight: 800;
      margin-top: 20px;
    }

    .chips {
      display: flex;
      gap: 10px;
      margin-top: 30px;
    }

    .chip {
      background: #fff;
      border: 1px solid rgba(90, 172, 172, .18);
      box-shadow: 0 8px 24px rgba(90, 172, 172, .12);
      border-radius: 14px;
      padding: 10px 16px;
      font-weight: 800;
      color: #4A6080;
    }

    .topic-img {
      position: absolute;
      right: 48px;
      top: 114px;
      width: 330px;
      height: 246px;
      border-radius: 24px;
      overflow: hidden;
      background: #F8FBFB;
      border: 2px solid rgba(90, 172, 172, .18);
      box-shadow: 0 16px 44px rgba(26, 58, 90, .16);
    }

    .topic-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <div class="cover">
    <div class="cover-card">
      <div class="lesson">BÀI 1 · 第一课</div>
      <div class="aligned-text cover-align">
        <span class="a-word"><span class="a-pin">nǐ</span><span class="a-han">你</span></span>
        <span class="a-word"><span class="a-pin">hǎo</span><span class="a-han">好</span></span>
      </div>
      <div class="vi">Xin chào</div>
      <div class="chips">
        <span class="chip">chào hỏi</span>
        <span class="chip">làm quen</span>
        <span class="chip">số đếm</span>
      </div>
    </div>
    <div class="topic-img"><img src="assets/photos/cover-topic.png" alt=""></div>
  </div>
  <script src="assets/slide-base.js"></script>
</body>
</html>
