    <script>
      let writer; window.lessonWriter = null;
      const embeddedCharData = {"strokes":["M 518 382 Q 572 385 623 389 Q 758 399 900 383 Q 928 379 935 390 Q 944 405 930 419 Q 896 452 845 475 Q 829 482 798 473 Q 723 460 480 434 Q 180 409 137 408 Q 130 408 124 408 Q 108 408 106 395 Q 105 380 127 363 Q 146 348 183 334 Q 195 330 216 338 Q 232 344 306 354 Q 400 373 518 382 Z"],"medians":[[[121,393],[193,372],[417,402],[827,434],[920,401]]]};
      function initWriter(){
        const el=document.getElementById('writer-target');
        const ch=el.dataset.char;
        if(!window.HanziWriter){ el.innerHTML='<div class="fallback-char">'+ch+'</div>'; return; }
        writer=HanziWriter.create('writer-target', ch, {
          width: 230, height: 230, padding: 18, showOutline: true, showCharacter: false,
          strokeAnimationSpeed: 0.575, delayBetweenStrokes: 360,
          charDataLoader: function(char, onComplete){ onComplete(embeddedCharData); }

        window.lessonWriter = writer;
        setTimeout(()=>writer.animateCharacter(), 500);
      }
      function playStroke(){ if(writer) writer.animateCharacter(); }
      initWriter();
    </script>
