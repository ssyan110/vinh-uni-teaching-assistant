<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Lesson 01</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fa;
      color: #1a3a5a;
    }
    main {
      width: min(520px, calc(100vw - 32px));
      padding: 28px;
      border: 1px solid #d0d8e0;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 8px 28px rgba(26, 58, 90, .12);
      text-align: center;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }
    p {
      margin: 0 0 18px;
      color: #6e7f93;
      line-height: 1.5;
    }
    code {
      display: block;
      margin: 14px 0 18px;
      padding: 12px 14px;
      border-radius: 8px;
      background: #eef4f6;
      color: #1a3a5a;
      font-size: 14px;
      text-align: left;
      white-space: nowrap;
      overflow-x: auto;
    }
    a {
      display: inline-block;
      padding: 10px 16px;
      border-radius: 8px;
      background: #5aacac;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Bai 1 · 你好</h1>
    <p id="message">Opening the classroom presenter.</p>
    <code id="serverCommand" hidden>python3 -m http.server 8787</code>
    <a id="openLink" href="slides/index.html">Open presenter</a>
  </main>
  <script>
    const message = document.getElementById('message');
    const command = document.getElementById('serverCommand');
    const link = document.getElementById('openLink');
    const localUrl = 'http://127.0.0.1:8787/output/book-1/lesson-01/';

    if (location.protocol === 'file:') {
      message.textContent = 'PDF export and annotations need localhost. Start the server from the project root, then open this link.';
      command.hidden = false;
      link.href = localUrl;
      link.textContent = 'Open localhost presenter';
    } else {
      window.location.replace('slides/index.html');
    }
  </script>
</body>
</html>
