<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=960,height=540">
  <title>Luyện đọc</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="assets/slide-base.css">
  <style>
    .practice-wrap{position:absolute;left:68px;right:68px;top:86px;bottom:46px}
    .practice-head{display:flex;align-items:flex-end;justify-content:flex-start;margin-bottom:24px}
    .practice-title{font-size:36px;line-height:1.08;font-weight:900;color:#1A3A5A}
    .reading-board{display:grid;gap:18px;margin-top:18px}
    .reading-line{display:grid;grid-template-columns:112px 1fr;align-items:center;min-height:82px;background:#fff;border:1px solid rgba(90,172,172,.18);border-radius:20px;box-shadow:0 9px 24px rgba(90,172,172,.10);overflow:hidden}
    .initial-label{height:100%;display:flex;align-items:center;justify-content:center;background:#E8F4F4;color:#5AACAC;font-size:34px;font-weight:950}
    .syllables{display:flex;align-items:center;gap:32px;padding:0 30px;color:#1A3A5A;font-size:34px;font-weight:900;line-height:1;white-space:nowrap}
  </style>
</head>
<body>
  <div class="slide">
    <div class="menu-bar"><span class="menu-icon"><i data-lucide="list-checks"></i></span><span class="section-label">Ôn tập</span></div>
    <div class="practice-wrap">
      <div class="practice-head">
        <div class="practice-title">Luyện đọc</div>
      </div>
      <div class="reading-board">
        <div class="reading-line"><div class="initial-label">j</div><div class="syllables"><span>juān</span><span>juǎn</span><span>juàn</span></div></div>
        <div class="reading-line"><div class="initial-label">q</div><div class="syllables"><span>quān</span><span>quán</span><span>quǎn</span><span>quàn</span></div></div>
        <div class="reading-line"><div class="initial-label">x</div><div class="syllables"><span>xuān</span><span>xuán</span><span>xuǎn</span><span>xuàn</span></div></div>
      </div>
    </div>
  </div>
  <script src="assets/slide-base.js"></script>
</body>
</html>
