<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=960,height=540">
  <title>Luyện đọc</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="assets/slide-base.css">
  <style>
    .practice-wrap{position:absolute;left:58px;right:58px;top:82px;bottom:36px}
    .practice-head{display:flex;align-items:flex-end;justify-content:flex-start;margin-bottom:18px}
    .practice-title{font-size:36px;line-height:1.08;font-weight:900;color:#1A3A5A}
    .reading-board{display:grid;gap:12px}
    .reading-line{display:grid;grid-template-columns:96px 1fr;align-items:center;min-height:62px;background:#fff;border:1px solid rgba(90,172,172,.18);border-radius:18px;box-shadow:0 8px 22px rgba(90,172,172,.09);overflow:hidden}
    .final-label{height:100%;display:flex;align-items:center;justify-content:center;background:#E8F4F4;color:#5AACAC;font-size:25px;font-weight:950}
    .syllables{display:flex;align-items:center;gap:22px;padding:0 24px;color:#1A3A5A;font-size:28px;font-weight:900;line-height:1;white-space:nowrap}
  </style>
</head>
<body>
  <div class="slide">
    <div class="menu-bar"><span class="menu-icon"><i data-lucide="list-checks"></i></span><span class="section-label">Ôn tập</span></div>
    <div class="practice-wrap">
      <div class="practice-head">
        <div class="practice-title">Luyện đọc</div>
      </div>
      <div class="reading-board">
        <div class="reading-line"><div class="final-label">ia</div><div class="syllables"><span>jiā</span><span>qiā</span><span>xiā</span><span>jià</span><span>xià</span></div></div>
        <div class="reading-line"><div class="final-label">iao</div><div class="syllables"><span>biāo</span><span>piào</span><span>miǎo</span><span>diào</span><span>tiáo</span><span>niǎo</span><span>liào</span></div></div>
        <div class="reading-line"><div class="final-label">ian</div><div class="syllables"><span>biān</span><span>piàn</span><span>mián</span><span>diàn</span><span>tián</span><span>nián</span><span>lián</span></div></div>
        <div class="reading-line"><div class="final-label">iang</div><div class="syllables"><span>jiāng</span><span>qiáng</span><span>xiǎng</span><span>liàng</span></div></div>
        <div class="reading-line"><div class="final-label">iong</div><div class="syllables"><span>jiōng</span><span>qióng</span><span>xiǒng</span><span>yòng</span></div></div>
      </div>
    </div>
  </div>
  <script src="assets/slide-base.js"></script>
</body>
</html>
