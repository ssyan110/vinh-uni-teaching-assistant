<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=960,height=540">
  <title>Đúng hay sai?</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="assets/slide-base.css">
  <style>
    .tf-wrap{position:absolute;left:52px;right:52px;top:78px;bottom:34px}
    .tf-title{font-size:34px;line-height:1.1;font-weight:950;color:#1A3A5A;margin-bottom:16px}
    .tf-title .accent{color:#5AACAC}
    .tf-grid{display:grid;grid-template-columns:1fr 1fr;column-gap:32px;row-gap:14px}
    .tf-row{position:relative;display:grid;grid-template-columns:244px 1fr 58px;align-items:center;min-height:104px}
    .tf-card{position:relative;height:104px;border-radius:18px;border:1px solid rgba(90,172,172,.20);background:rgba(255,255,255,.94);display:grid;grid-template-columns:88px 1fr;align-items:center;box-sizing:border-box;padding:8px 14px 8px 20px;box-shadow:0 8px 22px rgba(90,172,172,.10)}
    .tf-card:before{content:"";position:absolute;inset:0;border-radius:18px;background:linear-gradient(90deg,rgba(232,244,244,.78),rgba(255,255,255,0) 38%);pointer-events:none}
    .tf-num{position:absolute;left:-14px;top:-11px;width:36px;height:36px;border-radius:999px;background:#5AACAC;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:950;z-index:2;box-shadow:0 5px 13px rgba(90,172,172,.24)}
    .tf-img{width:72px;height:72px;border-radius:16px;object-fit:cover;background:#F4FAFA;border:2px solid rgba(90,172,172,.28);box-shadow:0 4px 10px rgba(90,172,172,.10);z-index:1}
    .tf-text{text-align:center}
    .tf-pin{font-size:25px;line-height:1;font-weight:900;color:#1A3A5A;letter-spacing:.2px}
    .tf-han{font-family:'Noto Sans SC';font-size:39px;line-height:1.05;font-weight:900;color:#1A3A5A;margin-top:10px}
    .tf-line{height:0;border-top:2px dashed rgba(90,172,172,.55);margin:0 10px}
    .tf-actions{display:grid;gap:9px;justify-items:center}
    .mark{width:46px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:#fff;box-shadow:0 5px 13px rgba(90,172,172,.12);position:relative}
    .mark:after{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent}
    .mark i{width:24px;height:24px;stroke-width:4}
    .mark.yes{color:#5AACAC;border:2px solid rgba(90,172,172,.44)}
    .mark.yes:after{border-top:8px solid rgba(90,172,172,.44)}
    .mark.no{color:#F05A62;border:2px solid rgba(240,90,98,.42)}
    .mark.no:after{border-top:8px solid rgba(240,90,98,.42)}
  </style>
</head>
<body>
  <div class="slide">
    <div class="menu-bar"><span class="menu-icon"><i data-lucide="list-checks"></i></span><span class="section-label">Ôn tập</span></div>
    <div class="tf-wrap">
      <div class="tf-title">Phiên âm này <span class="accent">đúng hay sai?</span></div>
      <div class="tf-grid">
        <div class="tf-row">
          <div class="tf-card"><div class="tf-num">1</div><img class="tf-img" src="assets/vocab-images/vocab-v004-xiao.png" alt="小"><div class="tf-text"><div class="tf-pin">xiǎo</div><div class="tf-han">小</div></div></div>
          <div class="tf-line"></div><div class="tf-actions"><div class="mark yes"><i data-lucide="check"></i></div><div class="mark no"><i data-lucide="x"></i></div></div>
        </div>
        <div class="tf-row">
          <div class="tf-card"><div class="tf-num">4</div><img class="tf-img" src="assets/vocab-images/vocab-v010-huanggua.png" alt="黄瓜"><div class="tf-text"><div class="tf-pin">huángguǎ</div><div class="tf-han">黄瓜</div></div></div>
          <div class="tf-line"></div><div class="tf-actions"><div class="mark yes"><i data-lucide="check"></i></div><div class="mark no"><i data-lucide="x"></i></div></div>
        </div>
        <div class="tf-row">
          <div class="tf-card"><div class="tf-num">2</div><img class="tf-img" src="assets/vocab-images/vocab-v006-qian.png" alt="钱"><div class="tf-text"><div class="tf-pin">qiáng</div><div class="tf-han">钱</div></div></div>
          <div class="tf-line"></div><div class="tf-actions"><div class="mark yes"><i data-lucide="check"></i></div><div class="mark no"><i data-lucide="x"></i></div></div>
        </div>
        <div class="tf-row">
          <div class="tf-card"><div class="tf-num">5</div><img class="tf-img" src="assets/vocab-images/vocab-v014-kuai.png" alt="快"><div class="tf-text"><div class="tf-pin">kuài</div><div class="tf-han">快</div></div></div>
          <div class="tf-line"></div><div class="tf-actions"><div class="mark yes"><i data-lucide="check"></i></div><div class="mark no"><i data-lucide="x"></i></div></div>
        </div>
        <div class="tf-row">
          <div class="tf-card"><div class="tf-num">3</div><img class="tf-img" src="assets/vocab-images/vocab-v008-qiong.png" alt="穷"><div class="tf-text"><div class="tf-pin">qióng</div><div class="tf-han">穷</div></div></div>
          <div class="tf-line"></div><div class="tf-actions"><div class="mark yes"><i data-lucide="check"></i></div><div class="mark no"><i data-lucide="x"></i></div></div>
        </div>
        <div class="tf-row">
          <div class="tf-card"><div class="tf-num">6</div><img class="tf-img" src="assets/vocab-images/vocab-v017-chunjuan.png" alt="春卷"><div class="tf-text"><div class="tf-pin">chūnjuàn</div><div class="tf-han">春卷</div></div></div>
          <div class="tf-line"></div><div class="tf-actions"><div class="mark yes"><i data-lucide="check"></i></div><div class="mark no"><i data-lucide="x"></i></div></div>
        </div>
      </div>
    </div>
  </div>
  <script src="assets/slide-base.js"></script>
</body>
</html>
