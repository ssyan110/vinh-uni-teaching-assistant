<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=960,height=540">
  <title>Nghe và chọn đáp án đúng</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="assets/slide-base.css">
  <style>
    .choice-wrap{position:absolute;left:54px;right:54px;top:78px;bottom:36px}
    .choice-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
    .choice-title{font-size:34px;line-height:1.1;font-weight:950;color:#1A3A5A}
    .choice-title span{color:#5AACAC}
    .choice-part{font-size:13px;font-weight:900;color:#5AACAC;background:#E8F4F4;border-radius:999px;padding:8px 15px}
    .choice-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
    .choice-card{position:relative;height:340px;border-radius:22px;background:rgba(255,255,255,.94);border:1px solid rgba(90,172,172,.18);box-shadow:0 10px 26px rgba(90,172,172,.11);padding:18px 14px 16px;box-sizing:border-box;text-align:center;display:flex;flex-direction:column;align-items:center}
    .choice-num{position:absolute;left:14px;top:14px;width:34px;height:34px;border-radius:999px;background:#5AACAC;color:#fff;font-size:18px;font-weight:950;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 13px rgba(90,172,172,.24)}
    .choice-img{width:118px;height:118px;border-radius:18px;object-fit:cover;background:#F4FAFA;border:2px solid rgba(90,172,172,.24);box-shadow:0 7px 18px rgba(90,172,172,.12);margin-top:18px}
    .choice-han{font-family:'Noto Sans SC';font-size:36px;line-height:1;font-weight:900;color:#1A3A5A;margin:15px 0 14px}
    .option-list{display:grid;gap:10px;width:100%;margin-top:auto}
    .option{height:50px;border-radius:16px;background:#fff;border:2px solid rgba(90,172,172,.28);display:flex;align-items:center;justify-content:center;color:#1A3A5A;font-size:25px;line-height:1;font-weight:900;box-shadow:0 5px 14px rgba(90,172,172,.08)}
    .option.alt{border-color:rgba(26,58,90,.22);background:#F8FBFB;color:#4A6080}
  </style>
</head>
<body>
  <div class="slide">
    <div class="menu-bar"><span class="menu-icon"><i data-lucide="headphones"></i></span><span class="section-label">Luyện từ vựng</span></div>
    <div class="choice-wrap">
      <div class="choice-head">
        <div class="choice-title">Nghe và chọn <span>đáp án đúng</span></div>
        <div class="choice-part">phần 1</div>
      </div>
      <div class="choice-grid">
        <div class="choice-card"><div class="choice-num">1</div><img class="choice-img" src="assets/vocab-images/vocab-v009-hua.png" alt="花"><div class="choice-han">花</div><div class="option-list"><div class="option">huā</div><div class="option alt">huà</div></div></div>
        <div class="choice-card"><div class="choice-num">2</div><img class="choice-img" src="assets/vocab-images/vocab-v010-huanggua.png" alt="黄瓜"><div class="choice-han">黄瓜</div><div class="option-list"><div class="option">huángguā</div><div class="option alt">huángguǎ</div></div></div>
        <div class="choice-card"><div class="choice-num">3</div><img class="choice-img" src="assets/vocab-images/vocab-v011-duo.png" alt="多"><div class="choice-han">多</div><div class="option-list"><div class="option">duō</div><div class="option alt">duò</div></div></div>
        <div class="choice-card"><div class="choice-num">4</div><img class="choice-img" src="assets/vocab-images/vocab-v012-shuo.png" alt="说"><div class="choice-han">说</div><div class="option-list"><div class="option">shuō</div><div class="option alt">shuò</div></div></div>
      </div>
    </div>
  </div>
  <script src="assets/slide-base.js"></script>
</body>
</html>
