<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=960,height=540">
  <title>Nghe và nối</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="assets/slide-base.css">
  <style>
    .match-wrap{position:absolute;left:48px;right:48px;top:78px;bottom:32px}
    .match-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
    .match-title{font-size:36px;line-height:1.08;font-weight:950;color:#1A3A5A}
    .final-bank{display:flex;gap:8px;background:rgba(255,255,255,.82);border:1px solid rgba(90,172,172,.18);border-radius:999px;padding:8px 12px;box-shadow:0 8px 20px rgba(90,172,172,.08)}
    .final-bank span{height:30px;min-width:50px;border-radius:999px;background:#E8F4F4;color:#5AACAC;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:950}
    .columns{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;align-items:start}
    .col{display:grid;grid-template-rows:84px 23px 146px;justify-items:center;text-align:center}
    .prompt{width:100%;height:84px;border-radius:18px;background:#fff;border:2px solid rgba(90,172,172,.22);box-shadow:0 8px 22px rgba(90,172,172,.10);display:flex;align-items:center;justify-content:center;color:#1A3A5A}
    .prompt-text{display:inline-flex;align-items:baseline;justify-content:center;font-size:32px;font-weight:950;line-height:1}
    .blank{display:inline-block;width:42px;height:.78em;border-bottom:3px solid #1A3A5A;margin-left:3px;transform:translateY(-1px)}
    .letter{font-size:23px;line-height:1;font-weight:950;color:#1A3A5A;align-self:start}
    .image-card{height:146px;border-radius:20px;background:#fff;border:1px solid rgba(90,172,172,.18);box-shadow:0 9px 24px rgba(90,172,172,.10);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;box-sizing:border-box}
    .image-card img{width:96px;height:96px;border-radius:16px;object-fit:cover;border:2px solid rgba(90,172,172,.24);background:#F4FAFA}
    .han{font-family:'Noto Sans SC';font-size:24px;line-height:1;font-weight:900;color:#1A3A5A;margin-top:8px}
  </style>
</head>
<body>
  <div class="slide">
    <div class="menu-bar"><span class="menu-icon"><i data-lucide="pen-line"></i></span><span class="section-label">Ôn tập</span></div>
    <div class="match-wrap">
      <div class="match-head">
        <div class="match-title">Nghe và nối</div>
        <div class="final-bank"><span>ua</span><span>uo</span><span>uai</span><span>uan</span><span>uang</span></div>
      </div>
      <div class="columns">
        <div class="col"><div class="prompt"><span class="prompt-text">1. h<span class="blank"></span></span></div><div class="letter">A.</div><div class="image-card"><img src="assets/vocab-images/vocab-v011-duo.png" alt="多"><div class="han">多</div></div></div>
        <div class="col"><div class="prompt"><span class="prompt-text">2. sh<span class="blank"></span></span></div><div class="letter">B.</div><div class="image-card"><img src="assets/vocab-images/vocab-v015-chuan.png" alt="船"><div class="han">船</div></div></div>
        <div class="col"><div class="prompt"><span class="prompt-text">3. h<span class="blank"></span></span></div><div class="letter">C.</div><div class="image-card"><img src="assets/vocab-images/vocab-v009-hua.png" alt="花"><div class="han">花</div></div></div>
        <div class="col"><div class="prompt"><span class="prompt-text">4. d<span class="blank"></span></span></div><div class="letter">D.</div><div class="image-card"><img src="assets/vocab-images/vocab-v016-chuang.png" alt="床"><div class="han">床</div></div></div>
        <div class="col"><div class="prompt"><span class="prompt-text">5. ch<span class="blank"></span></span></div><div class="letter">E.</div><div class="image-card"><img src="assets/vocab-images/vocab-v012-shuo.png" alt="说"><div class="han">说</div></div></div>
        <div class="col"><div class="prompt"><span class="prompt-text">6. ch<span class="blank"></span></span></div><div class="letter">F.</div><div class="image-card"><img src="assets/vocab-images/vocab-v013-huai.png" alt="坏"><div class="han">坏</div></div></div>
      </div>
    </div>
  </div>
  <script src="assets/slide-base.js"></script>
</body>
</html>
