<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">

  <title>Quy tắc viết 3</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="assets/slide-base.css">
  <style>
    .divider-left{position:absolute;left:0;top:40px;bottom:0;width:54%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}

  <div class="slide">
    <div class="menu-bar"><span class="menu-icon"><i data-lucide="wand-sparkles"></i></span><span class="section-label">QUY TẮC VIẾT 3</span></div>
    <div class="divider-left">
      <div class="divider-kicker">QUY TẮC VIẾT 3</div>
      <div class="divider-zh">iu特殊规则</div>
