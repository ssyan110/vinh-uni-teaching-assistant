<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=960,height=540">
  <title>Ôn bài 6 - đúng hay sai</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="assets/slide-base.css">
  <style>
    .tf-wrap{position:absolute;left:52px;right:52px;top:88px;bottom:34px}
    .tf-title{font-size:35px;line-height:1.1;font-weight:950;color:#1A3A5A;margin:0 0 30px}.tf-title strong{color:#5AACAC}
    .tf-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 54px}
    .tf-row{display:grid;grid-template-columns:244px 1fr 62px;align-items:center;column-gap:16px}
    .tf-card{position:relative;height:82px;border-radius:16px;background:rgba(255,255,255,.9);border:1px solid rgba(90,172,172,.22);box-shadow:0 8px 22px rgba(90,172,172,.08);display:grid;grid-template-columns:82px 1fr;align-items:center;padding:8px 16px 8px 12px;box-sizing:border-box}
    .tf-num{position:absolute;left:-16px;top:-10px;width:36px;height:36px;border-radius:50%;background:#5AACAC;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:950}
    .tf-img{width:60px;height:60px;border-radius:13px;object-fit:cover;border:2px solid rgba(90,172,172,.32);background:#F8FBFB}
    .tf-pin{font-size:23px;line-height:1.05;font-weight:950;color:#1A3A5A}.tf-han{font-family:'Noto Sans SC';font-size:32px;line-height:1.02;font-weight:950;color:#1A3A5A;margin-top:3px}
    .dash{border-top:2px dashed rgba(90,172,172,.55)}
    .mark-stack{display:grid;gap:10px}
    .mark{width:48px;height:34px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;line-height:1;box-shadow:0 7px 16px rgba(26,58,90,.08)}
    .mark.ok{color:#5AACAC;border:2px solid rgba(90,172,172,.55)}.mark.no{color:#F05A62;border:2px solid rgba(240,90,98,.45)}
  </style>
</head>
<body>
  <div class="slide">
    <div class="menu-bar"><span class="menu-icon"><i data-lucide="list-checks"></i></span><span class="section-label">ÔN BÀI 6</span></div>
    <div class="tf-wrap">
      <h1 class="tf-title">Phiên âm này <strong>đúng hay sai?</strong></h1>
      <div class="tf-grid">
        <div class="tf-row"><div class="tf-card"><div class="tf-num">1</div><img class="tf-img" src="assets/review-lesson-06/vocab-v007-xiang.png" alt="香"><div><div class="tf-pin">xiāng</div><div class="tf-han">香</div></div></div><div class="dash"></div><div class="mark-stack"><div class="mark ok">✓</div><div class="mark no">×</div></div></div>
        <div class="tf-row"><div class="tf-card"><div class="tf-num">4</div><img class="tf-img" src="assets/review-lesson-06/vocab-v015-chuan.png" alt="船"><div><div class="tf-pin">chuǎn</div><div class="tf-han">船</div></div></div><div class="dash"></div><div class="mark-stack"><div class="mark ok">✓</div><div class="mark no">×</div></div></div>
        <div class="tf-row"><div class="tf-card"><div class="tf-num">2</div><img class="tf-img" src="assets/review-lesson-06/vocab-v012-shuo.png" alt="说"><div><div class="tf-pin">shuò</div><div class="tf-han">说</div></div></div><div class="dash"></div><div class="mark-stack"><div class="mark ok">✓</div><div class="mark no">×</div></div></div>
        <div class="tf-row"><div class="tf-card"><div class="tf-num">5</div><img class="tf-img" src="assets/review-lesson-06/vocab-v018-anquan.png" alt="安全"><div><div class="tf-pin">ānquán</div><div class="tf-han">安全</div></div></div><div class="dash"></div><div class="mark-stack"><div class="mark ok">✓</div><div class="mark no">×</div></div></div>
        <div class="tf-row"><div class="tf-card"><div class="tf-num">3</div><img class="tf-img" src="assets/review-lesson-06/vocab-v013-huai.png" alt="坏"><div><div class="tf-pin">huài</div><div class="tf-han">坏</div></div></div><div class="dash"></div><div class="mark-stack"><div class="mark ok">✓</div><div class="mark no">×</div></div></div>
        <div class="tf-row"><div class="tf-card"><div class="tf-num">6</div><img class="tf-img" src="assets/review-lesson-06/vocab-v019-xuan.png" alt="选"><div><div class="tf-pin">xuán</div><div class="tf-han">选</div></div></div><div class="dash"></div><div class="mark-stack"><div class="mark ok">✓</div><div class="mark no">×</div></div></div>
      </div>
    </div>
  </div>
  <script src="assets/slide-base.js"></script>
</body>
</html>
