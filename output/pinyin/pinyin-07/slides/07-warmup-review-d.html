<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=960,height=540">
  <title>Ôn bài 6 - điền phiên âm</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="assets/slide-base.css">
  <style>
    .fill-wrap{position:absolute;left:48px;right:48px;top:72px;bottom:36px}
    .fill-title{font-size:32px;line-height:1.15;font-weight:950;font-style:italic;color:#F05A62;margin:0 0 22px;max-width:850px}
    .fill-board{display:grid;grid-template-columns:170px repeat(3,1fr);gap:18px 28px;align-items:center}
    .row-label{font-size:30px;line-height:1.08;font-weight:950;color:#05070A}
    .blank-card{height:86px;border:3px solid #08A64B;background:rgba(255,255,255,.82);display:flex;align-items:center;justify-content:center;font-size:40px;line-height:1;font-weight:950;color:#294778;box-sizing:border-box}
    .small{font-size:35px}.wide{letter-spacing:2px}
  </style>
</head>
<body>
  <div class="slide">
    <div class="menu-bar"><span class="menu-icon"><i data-lucide="pen-line"></i></span><span class="section-label">ÔN BÀI 6</span></div>
    <div class="fill-wrap">
      <h1 class="fill-title">Nghe và điền những phần còn thiếu vào chỗ trống để hoàn chỉnh những phiên âm sau.</h1>
      <div class="fill-board">
        <div class="row-label">vận mẫu</div>
        <div class="blank-card">_iā</div>
        <div class="blank-card">_iǎo</div>
        <div class="blank-card">_uáng</div>
        <div class="row-label">thanh mẫu</div>
        <div class="blank-card small">h _ _</div>
        <div class="blank-card small">q _ _</div>
        <div class="blank-card small">ch _ _</div>
        <div class="row-label">thanh điệu</div>
        <div class="blank-card wide">qian</div>
        <div class="blank-card wide">kuai</div>
        <div class="blank-card wide">chunjuan</div>
      </div>
    </div>
  </div>
  <script src="assets/slide-base.js"></script>
</body>
</html>
