<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=960,height=540">
  <title>Ôn bài 6 - chọn hình</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="assets/slide-base.css">
  <style>
    .review-wrap{position:absolute;left:54px;right:54px;top:78px;bottom:38px}
    .review-title{font-size:30px;line-height:1.12;font-weight:950;color:#1A3A5A;margin:0 0 28px}
    .review-title strong{color:#5AACAC}
    .choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 34px}
    .choice-item{position:relative;height:88px;border:1px solid rgba(90,172,172,.25);border-radius:18px;background:rgba(255,255,255,.9);box-shadow:0 9px 22px rgba(90,172,172,.09);display:grid;grid-template-columns:132px 78px 78px;align-items:center;justify-content:end;column-gap:18px;padding:0 24px 0 58px;box-sizing:border-box}
    .choice-num{position:absolute;left:-18px;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;background:#5AACAC;color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:950;box-shadow:0 8px 18px rgba(90,172,172,.18)}
    .choice-pin{font-size:28px;line-height:1;font-weight:950;color:#294778;white-space:nowrap}
    .choice-pin.long{font-size:22px}
    .option{position:relative;display:flex;align-items:center;justify-content:center}
    .option-label{position:absolute;top:-48px;left:50%;transform:translateX(-50%);width:34px;height:30px;border-radius:9px;background:#5AACAC;color:#fff;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:950;box-shadow:0 7px 16px rgba(90,172,172,.2)}
    .option img{width:66px;height:66px;border-radius:16px;object-fit:cover;border:2px solid rgba(90,172,172,.24);background:#F8FBFB;box-shadow:0 7px 16px rgba(26,58,90,.1)}
  </style>
</head>
<body>
  <div class="slide">
    <div class="menu-bar"><span class="menu-icon"><i data-lucide="image"></i></span><span class="section-label">ÔN BÀI 6</span></div>
    <div class="review-wrap">
      <h1 class="review-title">Hình nào tương ứng với <strong>phiên âm</strong> dưới đây?</h1>
      <div class="choice-grid">
        <div class="choice-item">
          <div class="choice-num">1</div><div class="choice-pin">xiǎo</div>
          <div class="option"><div class="option-label">A</div><img src="assets/review-lesson-06/vocab-v004-xiao.png" alt="小"></div>
          <div class="option"><div class="option-label">B</div><img src="assets/review-lesson-06/vocab-v014-kuai.png" alt="快"></div>
        </div>
        <div class="choice-item">
          <div class="choice-num">2</div><div class="choice-pin">qián</div>
          <div class="option"><div class="option-label">A</div><img src="assets/review-lesson-06/vocab-v006-qian.png" alt="钱"></div>
          <div class="option"><div class="option-label">B</div><img src="assets/review-lesson-06/vocab-v010-huanggua.png" alt="黄瓜"></div>
        </div>
        <div class="choice-item">
          <div class="choice-num">3</div><div class="choice-pin">qióng</div>
          <div class="option"><img src="assets/review-lesson-06/vocab-v008-qiong.png" alt="穷"></div>
          <div class="option"><img src="assets/review-lesson-06/vocab-v009-hua.png" alt="花"></div>
        </div>
        <div class="choice-item">
          <div class="choice-num">4</div><div class="choice-pin long">huángguā</div>
          <div class="option"><img src="assets/review-lesson-06/vocab-v010-huanggua.png" alt="黄瓜"></div>
          <div class="option"><img src="assets/review-lesson-06/vocab-v017-chunjuan.png" alt="春卷"></div>
        </div>
        <div class="choice-item">
          <div class="choice-num">5</div><div class="choice-pin">kuài</div>
          <div class="option"><img src="assets/review-lesson-06/vocab-v011-duo.png" alt="多"></div>
          <div class="option"><img src="assets/review-lesson-06/vocab-v014-kuai.png" alt="快"></div>
        </div>
        <div class="choice-item">
          <div class="choice-num">6</div><div class="choice-pin long">chūnjuǎn</div>
          <div class="option"><img src="assets/review-lesson-06/vocab-v017-chunjuan.png" alt="春卷"></div>
          <div class="option"><img src="assets/review-lesson-06/vocab-v016-chuang.png" alt="床"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="assets/slide-base.js"></script>
</body>
</html>
