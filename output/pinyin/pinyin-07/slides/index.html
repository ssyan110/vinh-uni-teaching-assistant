function restoreCanvas(){ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);const dpr=window.devicePixelRatio||1;ctx.setTransform(dpr,0,0,dpr,0,0);if(slideDrawings[current]){const img=new Image();img.onload=()=>{ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);ctx.setTransform(dpr,0,0,dpr,0,0);};img.src=slideDrawings[current];}}
function restoreText(){slideSurface.querySelectorAll('.text-annotation').forEach(el=>el.remove());(slideText[current]||[]).forEach(d=>createTextBox(d));}
function slideName(file){return file.replace(/^\d+-/,'').replace(/\.html$/,'').replace(/-/g,' ');}
function loadThumb(iframe){if(iframe&&!iframe.getAttribute('src'))iframe.src=iframe.dataset.src;}
function buildThumbnails(){thumbList.innerHTML='';if('IntersectionObserver' in window)thumbObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting)loadThumb(entry.target.querySelector('iframe'));}),{root:thumbList,rootMargin:'240px 0px'});MANIFEST.forEach((file,i)=>{const btn=document.createElement('button');btn.className='thumb-button';btn.type='button';btn.setAttribute('aria-label','Slide '+(i+1)+': '+slideName(file));btn.addEventListener('click',()=>goToSlide(i));const num=document.createElement('span');num.className='thumb-number';num.textContent=String(i+1).padStart(2,'0');const preview=document.createElement('span');preview.className='thumb-preview';const iframe=document.createElement('iframe');iframe.dataset.src=file;iframe.title='Slide '+(i+1);iframe.tabIndex=-1;iframe.loading='lazy';preview.appendChild(iframe);const name=document.createElement('span');name.className='thumb-name';name.textContent=slideName(file);btn.append(num,preview,name);thumbList.appendChild(btn);if(i<6||!thumbObserver)loadThumb(iframe);if(thumbObserver)thumbObserver.observe(btn);});}
function updateThumbnails(){const buttons=thumbList.querySelectorAll('.thumb-button');buttons.forEach((btn,i)=>{btn.classList.toggle('active',i===current);btn.setAttribute('aria-current',i===current?'true':'false');});const active=buttons[current];if(active){loadThumb(active.querySelector('iframe'));requestAnimationFrame(()=>active.scrollIntoView({block:'nearest'}));}}
function goToSlide(index){if(index===current)return;saveCanvas();current=index;update();}
function update(){frame.src=MANIFEST[current];document.getElementById('counter').textContent=(current+1)+' / '+MANIFEST.length;document.getElementById('counterFloat').textContent=(current+1)+' / '+MANIFEST.length;updateThumbnails();updateVideoLink();setTimeout(()=>{restoreCanvas();restoreText();},80);}
function prev(){if(current>0){saveCanvas();current--;update();}}function next(){if(current<MANIFEST.length-1){saveCanvas();current++;update();}}
function pushUndo(){(slideHistory[current]||(slideHistory[current]=[])).push(canvas.toDataURL());if(slideHistory[current].length>40)slideHistory[current].shift();}
function undo(){const h=slideHistory[current];if(!h||!h.length)return;const img=new Image();img.onload=()=>{ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);ctx.setTransform(window.devicePixelRatio||1,0,0,window.devicePixelRatio||1,0,0);saveCanvas();};img.src=h.pop();}
function closeToolMenus(exceptId=null){document.querySelectorAll('.tool-menu,.eraser-menu').forEach(menu=>{if(menu.id!==exceptId)menu.classList.remove('show');});}
function closeEraserMenus(){closeToolMenus();}
function toggleToolMenu(id){const menu=document.getElementById(id);if(!menu)return;const show=!menu.classList.contains('show');closeToolMenus(show?id:null);if(show)menu.classList.add('show');}
function toggleEraserMenu(id){if(eraserMode!==null){setEraser(null);return;}toggleToolMenu(id);}
function resetShapeDraft(){shapeStart=null;shapeSnapshot=null;}
function cancelShapeDraft(){if(shapeStart&&shapeSnapshot)restoreSnapshot(shapeSnapshot);resetShapeDraft();}
function setEraser(mode){cancelShapeDraft();eraserMode=mode;penActive=false;highlighterActive=false;textMode=false;shapeMode=null;closeToolMenus();setTools();}
function setTools(){const eraserActive=eraserMode!==null, shapeActive=shapeMode!==null, drawActive=penActive||highlighterActive, any=drawActive||eraserActive||shapeActive;canvas.classList.toggle('active',any);canvas.style.cursor=eraserMode==='object'?'pointer':eraserActive?'cell':any?'crosshair':'default';['penBtn','penBtnFloat'].forEach(id=>document.getElementById(id)?.classList.toggle('active',penActive));['highBtn','highBtnFloat'].forEach(id=>document.getElementById(id)?.classList.toggle('active',highlighterActive));['drawBtn','drawBtnFloat'].forEach(id=>document.getElementById(id)?.classList.toggle('active',drawActive));['drawLabel','drawLabelFloat'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=penActive?'Pen':highlighterActive?'Highlighter':'Draw';});['lineBtn','lineBtnFloat'].forEach(id=>document.getElementById(id)?.classList.toggle('active',shapeMode==='line'));['circleBtn','circleBtnFloat'].forEach(id=>document.getElementById(id)?.classList.toggle('active',shapeMode==='circle'));['rectBtn','rectBtnFloat'].forEach(id=>document.getElementById(id)?.classList.toggle('active',shapeMode==='rect'));['shapeBtn','shapeBtnFloat'].forEach(id=>document.getElementById(id)?.classList.toggle('active',shapeActive));['shapeLabel','shapeLabelFloat'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=shapeMode==='line'?'Line':shapeMode==='circle'?'Circle':shapeMode==='rect'?'Box':'Shape';});['eraseBtn','eraseBtnFloat'].forEach(id=>document.getElementById(id)?.classList.toggle('active',eraserActive));['pixelEraserBtn','pixelEraserBtnFloat'].forEach(id=>document.getElementById(id)?.classList.toggle('active',eraserMode==='pixel'));['objectEraserBtn','objectEraserBtnFloat'].forEach(id=>document.getElementById(id)?.classList.toggle('active',eraserMode==='object'));['textBtn','textBtnFloat','textAddBtn','textAddBtnFloat'].forEach(id=>document.getElementById(id)?.classList.toggle('active',textMode));updateInkDisplay();}
function togglePen(){cancelShapeDraft();penActive=!penActive;highlighterActive=false;eraserMode=null;textMode=false;shapeMode=null;closeToolMenus();setTools();}function toggleHighlighter(){cancelShapeDraft();highlighterActive=!highlighterActive;penActive=false;eraserMode=null;textMode=false;shapeMode=null;closeToolMenus();setTools();}function toggleEraser(){setEraser(eraserMode?null:'pixel');}function toggleText(){cancelShapeDraft();textMode=!textMode;penActive=false;highlighterActive=false;eraserMode=null;shapeMode=null;closeToolMenus();setTools();}
function toggleShape(mode){cancelShapeDraft();shapeMode=shapeMode===mode?null:mode;penActive=false;highlighterActive=false;eraserMode=null;textMode=false;closeToolMenus();setTools();}
function updateInkDisplay(){document.querySelectorAll('.ink-chip').forEach(chip=>{chip.style.background=penColor;});document.querySelectorAll('.swatch').forEach(s=>s.classList.toggle('selected',s.dataset.color===penColor));}
function pickColor(el){penColor=el.dataset.color;updateInkDisplay();closeToolMenus();if(!penActive&&!highlighterActive&&!shapeMode){penActive=true;eraserMode=null;textMode=false;setTools();}}
function applyTextStyle(){if(!activeTextEl)return;activeTextEl.style.color=textColor;activeTextEl.style.fontSize=textSize+'px';saveText();}
function pickTextColor(el){textColor=el.dataset.textColor;document.querySelectorAll('.text-color').forEach(btn=>btn.classList.toggle('active',btn.dataset.textColor===textColor));applyTextStyle();}
function setTextSize(value){textSize=Number(value)||24;document.querySelectorAll('.text-size').forEach(sel=>{sel.value=String(textSize);});applyTextStyle();}
function clearSlide(){pushUndo();ctx.clearRect(0,0,960,540);delete slideDrawings[current];slideSurface.querySelectorAll('.text-annotation').forEach(el=>el.remove());delete slideText[current];}
function getPos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*960,y:(e.clientY-r.top)/r.height*540};}
function captureCanvas(){return ctx.getImageData(0,0,canvas.width,canvas.height);}
function restoreSnapshot(snapshot){if(!snapshot)return;const dpr=window.devicePixelRatio||1;ctx.setTransform(1,0,0,1,0,0);ctx.putImageData(snapshot,0,0);ctx.setTransform(dpr,0,0,dpr,0,0);}
function drawShape(from,to){ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.strokeStyle=penColor;ctx.lineWidth=4;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();if(shapeMode==='line'){ctx.moveTo(from.x,from.y);ctx.lineTo(to.x,to.y);}else if(shapeMode==='circle'){const x=Math.min(from.x,to.x),y=Math.min(from.y,to.y),w=Math.abs(to.x-from.x),h=Math.abs(to.y-from.y);ctx.ellipse(x+w/2,y+h/2,w/2,h/2,0,0,Math.PI*2);}else if(shapeMode==='rect'){ctx.rect(from.x,from.y,to.x-from.x,to.y-from.y);}ctx.stroke();}
function startDraw(e){if(shapeMode){const p=getPos(e);if(shapeMode==='line'){if(!shapeStart){shapeStart=p;shapeSnapshot=captureCanvas();return;}pushUndo();restoreSnapshot(shapeSnapshot);drawShape(shapeStart,p);resetShapeDraft();saveCanvas();return;}drawing=true;shapeStart=p;shapeSnapshot=captureCanvas();pushUndo();return;}if(!penActive&&!highlighterActive&&eraserMode===null)return;drawing=true;pushUndo();const p=getPos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);}
function draw(e){const p=getPos(e);if(shapeMode){if(shapeMode==='line'&&shapeStart){restoreSnapshot(shapeSnapshot);drawShape(shapeStart,p);return;}if(!drawing||!shapeStart)return;restoreSnapshot(shapeSnapshot);drawShape(shapeStart,p);return;}if(!drawing)return;const eraserActive=eraserMode!==null;ctx.globalCompositeOperation=eraserActive?'destination-out':'source-over';ctx.globalAlpha=highlighterActive?0.3:1;ctx.strokeStyle=penColor;ctx.lineWidth=eraserMode==='object'?42:eraserActive?28:highlighterActive?18:3;ctx.lineCap='round';ctx.lineJoin='round';ctx.lineTo(p.x,p.y);ctx.stroke();ctx.beginPath();ctx.moveTo(p.x,p.y);}
function endDraw(e){if(shapeMode){if(!drawing||!shapeStart||!e)return;drawing=false;const p=getPos(e);restoreSnapshot(shapeSnapshot);drawShape(shapeStart,p);resetShapeDraft();saveCanvas();return;}if(!drawing)return;drawing=false;ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';saveCanvas();}
canvas.addEventListener('mousedown',startDraw);canvas.addEventListener('mousemove',draw);canvas.addEventListener('mouseup',endDraw);canvas.addEventListener('mouseleave',endDraw);
stageVideoLink?.addEventListener('click',e=>e.stopPropagation());
stage.addEventListener('click',e=>{if(textMode){const r=slideSurface.getBoundingClientRect();createTextBox({left:((e.clientX-r.left)/r.width*960)+'px',top:((e.clientY-r.top)/r.height*540)+'px',width:'220px',height:'64px',text:'',color:textColor,fontSize:textSize+'px'});textMode=false;setTools();return;}if(!penActive&&!highlighterActive&&eraserMode===null&&shapeMode===null)frame.contentWindow?.postMessage({type:'reveal-next'},'*');});
function attachTextDrag(el){let start=null,dragging=false;el.addEventListener('click',e=>e.stopPropagation());el.addEventListener('input',saveText);el.addEventListener('focus',()=>{activeTextEl=el;textColor=rgbToHex(getComputedStyle(el).color);textSize=parseInt(getComputedStyle(el).fontSize,10)||24;document.querySelectorAll('.text-color').forEach(btn=>btn.classList.toggle('active',btn.dataset.textColor.toLowerCase()===textColor.toLowerCase()));document.querySelectorAll('.text-size').forEach(sel=>{sel.value=String(textSize);});});el.addEventListener('pointerdown',e=>{e.stopPropagation();activeTextEl=el;const r=slideSurface.getBoundingClientRect();start={clientX:e.clientX,clientY:e.clientY,left:parseFloat(el.style.left)||0,top:parseFloat(el.style.top)||0,scaleX:r.width/960,scaleY:r.height/540};dragging=false;});document.addEventListener('pointermove',e=>{if(!start)return;const dx=(e.clientX-start.clientX)/start.scaleX,dy=(e.clientY-start.clientY)/start.scaleY;if(!dragging&&Math.hypot(dx,dy)<5)return;dragging=true;el.classList.add('dragging');el.style.left=Math.max(0,Math.min(940,start.left+dx))+'px';el.style.top=Math.max(0,Math.min(520,start.top+dy))+'px';});document.addEventListener('pointerup',()=>{if(!start)return;if(dragging)saveText();el.classList.remove('dragging');start=null;dragging=false;});}
function rgbToHex(value){const m=String(value).match(/\d+/g);if(!m)return '#000000';return '#'+m.slice(0,3).map(n=>Number(n).toString(16).padStart(2,'0')).join('').toUpperCase();}
function hexToRgb(value){const hex=String(value||'#000000').replace('#','');const full=hex.length===3?hex.split('').map(c=>c+c).join(''):hex;return [0,2,4].map(i=>parseInt(full.slice(i,i+2),16)||0);}
function createTextBox(d){const el=document.createElement('div');el.className='text-annotation';el.contentEditable='true';el.style.left=d.left;el.style.top=d.top;el.style.width=d.width;el.style.height=d.height;el.style.color=d.color||textColor;el.style.fontSize=d.fontSize||textSize+'px';el.innerText=d.text||'';slideSurface.appendChild(el);attachTextDrag(el);setTimeout(()=>{activeTextEl=el;el.focus();},0);}
function enterPresent(){document.body.classList.add('presenting');thumbSidebar.classList.remove('open');const req=document.documentElement.requestFullscreen?.();if(req?.catch)req.catch(()=>{});resizeStage();}function exitPresent(){document.body.classList.remove('presenting');thumbSidebar.classList.remove('open');const exit=document.exitFullscreen?.();if(exit?.catch)exit.catch(()=>{});resizeStage();}
document.addEventListener('click',e=>{if(!e.target.closest('.tool-group,.eraser-wrap'))closeToolMenus();});
let thumbHideTimer=null;
function showThumbSidebar(){if(!document.body.classList.contains('presenting'))return;thumbSidebar.classList.add('open');clearTimeout(thumbHideTimer);thumbHideTimer=setTimeout(()=>{if(!thumbSidebar.matches(':hover'))thumbSidebar.classList.remove('open');},1800);}
document.addEventListener('mousemove',e=>{if(!document.body.classList.contains('presenting'))return;if(e.clientX<34){showThumbSidebar();return;}if(e.clientX>270&&!thumbSidebar.matches(':hover')){clearTimeout(thumbHideTimer);thumbHideTimer=setTimeout(()=>thumbSidebar.classList.remove('open'),420);}});
document.addEventListener('keydown',e=>{if(e.target.isContentEditable)return;if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev();if(e.key.toLowerCase()==='f')enterPresent();if(e.key==='Escape'){if(penActive||highlighterActive||eraserMode!==null||textMode||shapeMode){cancelShapeDraft();penActive=false;highlighterActive=false;eraserMode=null;textMode=false;shapeMode=null;setTools();}else exitPresent();}if(e.key.toLowerCase()==='p')togglePen();if(e.key.toLowerCase()==='h')toggleHighlighter();if(e.key.toLowerCase()==='e')toggleEraser();if(e.key.toLowerCase()==='t')toggleText();if(e.key.toLowerCase()==='l')toggleShape('line');if(e.key.toLowerCase()==='o')toggleShape('circle');if(e.key.toLowerCase()==='r')toggleShape('rect');if(e.key.toLowerCase()==='z')undo();if(e.key.toLowerCase()==='c')clearSlide();});
function hideExportOverlay(){const overlay=document.getElementById('exportOverlay');overlay.classList.remove('show','error');}
function setExportError(message){
  const overlay=document.getElementById('exportOverlay'),title=document.getElementById('exportTitle'),status=document.getElementById('exportStatus'),bar=document.getElementById('exportBar');
  title.textContent='PDF export needs localhost';
  status.textContent=message;
  bar.style.width='100%';
  overlay.classList.add('show','error');
}
function waitForFrameLoad(iframe, src, timeoutMs=10000){
  return new Promise((resolve,reject)=>{
    const timer=setTimeout(()=>reject(new Error('Timed out loading '+src)),timeoutMs);
    iframe.onload=()=>setTimeout(()=>{clearTimeout(timer);resolve();},700);
    iframe.onerror=()=>{clearTimeout(timer);reject(new Error('Could not load '+src));};
    iframe.src=src;
  });
}
async function exportPDF(){
  const overlay=document.getElementById('exportOverlay'),title=document.getElementById('exportTitle'),status=document.getElementById('exportStatus'),bar=document.getElementById('exportBar'),close=document.getElementById('exportClose');
  overlay.classList.remove('error');
  title.textContent='Exporting PDF...';
  status.textContent='Rendering slide 1 / '+MANIFEST.length;
  bar.style.width='0%';
  close.style.display='';
  overlay.classList.add('show');

  if(location.protocol==='file:'){
    setExportError('Open this lesson through a local server before exporting. From the project root, run: python3 -m http.server 8787, then open http://127.0.0.1:8787/output/book-1/lesson-01/');
    return;
  }

  // Flush current slide's live canvas + text to storage before exporting
  saveCanvas();

  const pdf=new window.jspdf.jsPDF({orientation:'landscape',unit:'px',format:[960,540]});

  // Hidden render iframe — off-screen, fixed 960×540
  const renderFrame=document.createElement('iframe');
  renderFrame.style.cssText='position:fixed;left:-9999px;top:0;width:960px;height:540px;border:0;pointer-events:none;';
  document.body.appendChild(renderFrame);

  // Offscreen canvas for compositing slide + drawing layer
  const offCanvas=document.createElement('canvas');
  offCanvas.width=960; offCanvas.height=540;
  const offCtx=offCanvas.getContext('2d');

  try{
    for(let i=0;i<MANIFEST.length;i++){
      if(i>0) pdf.addPage([960,540],'landscape');
      status.textContent='Rendering slide '+(i+1)+' / '+MANIFEST.length;
      bar.style.width=((i+1)/MANIFEST.length*100)+'%';

      // 1. Render slide HTML into hidden iframe
      await waitForFrameLoad(renderFrame, MANIFEST[i]);

      let slideDoc;
      try{
        slideDoc=renderFrame.contentDocument||renderFrame.contentWindow.document;
      }catch(err){
        throw new Error('Browser blocked slide access. Open the deck through localhost, not file://.');
      }
      if(!slideDoc||!slideDoc.body)throw new Error('Slide did not render: '+MANIFEST[i]);
      const slideCanvas=await html2canvas(slideDoc.body,{
        width:960,height:540,scale:1,
        useCORS:true,allowTaint:true,
        backgroundColor:'#ffffff',
        logging:false,
      });

      // 2. Composite: slide base + pen/highlighter drawing layer
      offCtx.clearRect(0,0,960,540);
      offCtx.drawImage(slideCanvas,0,0,960,540);

      if(slideDrawings[i]){
        await new Promise(resolve=>{
          const drawImg=new Image();
          drawImg.onload=()=>{
            // Drawing canvas is stored at DPR scale; draw it scaled down to 960x540.
            offCtx.drawImage(drawImg,0,0,960,540);
            resolve();
          };
          drawImg.onerror=resolve;
          drawImg.src=slideDrawings[i];
        });
      }

      // 3. Add composited slide to PDF
      pdf.addImage(offCanvas.toDataURL('image/png'),'PNG',0,0,960,540,undefined,'FAST');

      // 4. Render text box annotations as PDF text (preserves selectability + crispness)
      (slideText[i]||[]).forEach(t=>{
        const x=parseFloat(t.left)||0,y=parseFloat(t.top)||0,w=parseFloat(t.width)||220,h=parseFloat(t.height)||64,text=t.text||'';
        if(!text.trim())return;
        const [r,g,b]=hexToRgb(t.color||'#000000'),fontSize=parseFloat(t.fontSize)||24;
        pdf.setTextColor(r,g,b);
        pdf.setFontSize(fontSize);
        pdf.text(pdf.splitTextToSize(text,w-12),x+6,y+fontSize);
      });
    }

    pdf.save('pinyin-07-teacher-deck.pdf');
    hideExportOverlay();
  }catch(err){
    console.error(err);
    setExportError(err.message||'PDF export failed. Open through localhost and try again.');
  }finally{
    if(renderFrame.parentNode)document.body.removeChild(renderFrame);
  }
}
window.addEventListener('resize',resizeStage);resizeCanvas();buildThumbnails();update();
