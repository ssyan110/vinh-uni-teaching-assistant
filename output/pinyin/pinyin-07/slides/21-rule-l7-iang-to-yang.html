<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=960,height=540">
  <title>iang → yang</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="assets/slide-base.css">
  <style>
    .rule-flash-wrap{position:absolute;left:60px;right:60px;top:80px;bottom:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
    .rule-title{font-size:34px;line-height:1.12;font-weight:900;color:#1A3A5A;margin-bottom:42px}
    .rule-flash-card{width:610px;height:270px;border-radius:26px;background:#fff;border:1px solid rgba(90,172,172,.18);box-shadow:0 14px 38px rgba(90,172,172,.16);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden}
    .rule-flash-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:58px;background:linear-gradient(180deg,#D4EDED,#E8F4F4)}
    .rule-token{position:relative;z-index:1;width:calc(100% - 96px);margin-left:58px;height:126px;display:flex;align-items:center;justify-content:center;gap:0;overflow:visible}
    .rule-from{font-size:68px;line-height:1;font-weight:950;color:#7C6BC8;letter-spacing:0;transition:transform .36s cubic-bezier(.2,.8,.2,1)}
    .rule-reveal{max-width:0;opacity:0;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:32px;margin-left:0;transform:translateX(-10px);transition:max-width .36s cubic-bezier(.2,.8,.2,1),opacity .24s ease,transform .36s cubic-bezier(.2,.8,.2,1),margin-left .36s cubic-bezier(.2,.8,.2,1)}
    .rule-reveal.revealed{max-width:340px;opacity:1;transform:translateX(0);margin-left:32px}
    .rule-arrow{font-size:48px;line-height:1;font-weight:950;color:#5AACAC;flex:0 0 auto}
    .rule-to{font-size:68px;line-height:1;font-weight:950;color:#1A3A5A;letter-spacing:0;flex:0 0 auto}
  </style>
</head>
<body>
  <div class="slide">
    <div class="menu-bar"><span class="menu-icon"><i data-lucide="wand-sparkles"></i></span><span class="section-label">Quy tắc viết pinyin</span></div>
    <div class="rule-flash-wrap">
      <div class="rule-title">iang: bấm để hiện cách viết đúng</div>
      <div class="rule-flash-card">
        <div class="rule-token">
          <span class="rule-from">iang</span>
          <span class="rule-reveal" data-reveal-step="1"><span class="rule-arrow">→</span><span class="rule-to">yang</span></span>
        </div>
      </div>
    </div>
  </div>
  <script src="assets/slide-base.js"></script>
</body>
</html>
