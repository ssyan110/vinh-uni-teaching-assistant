<style>

body.presenting{background:#000;padding:0;overflow:hidden}body.presenting .header,body.presenting .controls{display:none}body.presenting .stage{width:100vw;height:100vh;border-radius:0;box-shadow:none;transform:none!important;display:flex;align-items:center;justify-content:center}body.presenting .slide-surface{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(var(--present-scale,1));transform-origin:center center}

</style>

<body>
<div class="header"><h1>Pinyin Bài 2</h1><div class="subtitle">49 slides · Press <strong>F</strong> for presentation mode</div></div>
<aside class="thumb-sidebar" id="thumbSidebar" aria-label="Danh sách slide">

<div class="stage" id="stage"><div class="slide-surface" id="slideSurface"><iframe id="slideFrame" src="01-cover.html"></iframe><canvas id="drawCanvas"></canvas><a class="stage-video-link" id="stageVideoLink" href="#" target="_blank" rel="noopener noreferrer" aria-label="Mở video viết chữ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg></a></div></div>
<div class="controls" id="controls">
  <button class="btn" onclick="prev()">← Prev</button><span class="counter" id="counter">1 / 49</span><button class="btn" onclick="next()">Next →</button>
  <div class="separator"></div><button class="btn secondary" onclick="undo()">↩ Undo</button><button class="btn secondary" id="penBtn" onclick="togglePen()">✏️ Pen</button>
  <span class="swatch" style="background:#E04040" data-color="#E04040" onclick="pickColor(this)"></span><span class="swatch selected" style="background:#1A3A5A" data-color="#1A3A5A" onclick="pickColor(this)"></span><span class="swatch" style="background:#5AACAC" data-color="#5AACAC" onclick="pickColor(this)"></span><span class="swatch" style="background:#F5A623" data-color="#F5A623" onclick="pickColor(this)"></span>
  <button class="btn secondary" id="highBtn" onclick="toggleHighlighter()">🖍️ High</button><span class="eraser-wrap"><button class="btn secondary" id="eraseBtn" onclick="toggleEraserMenu('eraserMenu')">Eraser ▾</button><span class="eraser-menu" id="eraserMenu"><button class="btn" id="pixelEraserBtn" onclick="setEraser('pixel')">Pixel</button><button class="btn" id="objectEraserBtn" onclick="setEraser('object')">Object</button></span></span><button class="btn secondary" id="textBtn" onclick="toggleText()">T Text</button><button class="btn danger" onclick="clearSlide()">Clear</button>
  <div class="separator"></div><button class="btn download" onclick="exportPDF()">📥 PDF</button><button class="btn" onclick="enterPresent()">▶ Present</button>
</div>
<div class="float-toolbar">
  <button class="btn" onclick="prev()">←</button><span class="counter" id="counterFloat">1 / 49</span><button class="btn" onclick="next()">→</button>
  <div class="separator"></div><button class="btn" onclick="undo()">↩</button><button class="btn" id="penBtnFloat" onclick="togglePen()">✏️</button><button class="btn" id="highBtnFloat" onclick="toggleHighlighter()">🖍️</button><span class="eraser-wrap"><button class="btn" id="eraseBtnFloat" onclick="toggleEraserMenu('eraserMenuFloat')">Eraser ▾</button><span class="eraser-menu" id="eraserMenuFloat"><button class="btn" id="pixelEraserBtnFloat" onclick="setEraser('pixel')">Pixel</button><button class="btn" id="objectEraserBtnFloat" onclick="setEraser('object')">Object</button></span></span><button class="btn" id="textBtnFloat" onclick="toggleText()">T</button><button class="btn danger" onclick="clearSlide()">✕</button><button class="btn download" onclick="exportPDF()">📥</button><button class="btn secondary" onclick="exitPresent()">Esc</button>
</div>
<div class="export-overlay" id="exportOverlay"><div class="export-box"><h3 id="exportTitle">Exporting PDF...</h3><p id="exportStatus">Rendering slide 1 / 49</p><div class="export-progress"><div class="export-progress-bar" id="exportBar"></div></div><p style="margin-top:10px;font-size:11px;color:#B0BEC5">Rendering live from slides — always up to date</p><button class="btn secondary export-close" id="exportClose" onclick="hideExportOverlay()">Close</button></div></div>
<script>
const MANIFEST = [
  "01-cover.html",
  "02-objectives.html",
  "03-divider-review.html",
  "04-warmup-review.html",
  "05-divider-initials-1.html",
  "06-initials-dtnlgkh.html",
  "07-chart-dtnl.html",
  "08-chart-gkh.html",
  "09-practice-dtnl-tones.html",
  "10-practice-gkh-tones.html",
  "11-divider-vocabulary-1.html",
  "12-vocabulary-1.html",
  "13-flash-v001-da.html",
  "14-flash-v002-na.html",
  "15-flash-v003-nu.html",
  "16-flash-v004-lu.html",
  "17-flash-v005-ditu.html",
  "18-flash-v006-he.html",
  "19-flash-v007-kele.html",
  "20-flash-v008-gege.html",
  "21-practice-vocabulary-1-1.html",
  "22-practice-vocabulary-1-2.html",
  "23-divider-initials-2.html",
  "24-initials-jqx.html",
  "25-chart-jqx.html",
  "26-practice-jqx-tones.html",
  "27-divider-vocabulary-2.html",
  "28-vocabulary-2.html",
  "29-flash-v009-ji.html",
  "30-flash-v010-ji.html",
  "31-flash-v011-qi.html",
  "32-flash-v012-xi.html",
  "33-flash-v013-xi.html",
  "34-flash-v014-qima.html",
  "35-practice-vocabulary-2.html",
  "36-divider-rule-jqx.html",
  "37-rule-jqx-umlaut.html",
  "38-divider-vocabulary-3.html",
  "39-vocabulary-3.html",
  "40-flash-v015-qu.html",
  "41-flash-v016-ju.html",
  "42-flash-v017-jiqi.html",
  "43-flash-v018-jixu.html",
  "44-practice-rule-vocabulary.html",
  "45-divider-review-final.html",
  "46-review-listening-choice.html",
  "47-review-fill-blank.html",
  "48-review-meaning-match.html",
  "49-closing.html"
];
let current=0, penActive=false, highlighterActive=false, eraserMode=null, textMode=false, drawing=false, penColor='#1A3A5A';
const frame=document.getElementById('slideFrame'), stage=document.getElementById('stage'), slideSurface=document.getElementById('slideSurface'), canvas=document.getElementById('drawCanvas'), ctx=canvas.getContext('2d');
const stageVideoLink=document.getElementById('stageVideoLink');
const strokeVideoLinks={40:'https://www.youtube.com/watch?v=XwSzIyliD30',45:'https://www.youtube.com/watch?v=uTBt1Kr-xGQ',46:'https://www.youtube.com/watch?v=WdTgD-a5Eqk'};
const thumbSidebar=document.getElementById('thumbSidebar'), thumbList=document.getElementById('thumbList');
const slideDrawings={}, slideHistory={}, slideText={};
let thumbObserver=null;
function resizeCanvas(){const dpr=window.devicePixelRatio||1;canvas.width=960*dpr;canvas.height=540*dpr;canvas.style.width='960px';canvas.style.height='540px';ctx.setTransform(dpr,0,0,dpr,0,0);restoreCanvas();resizeStage();}
function positionVideoLink(){if(!stageVideoLink)return;const x=459,y=91,size=42;stageVideoLink.style.position='absolute';stageVideoLink.style.left=x+'px';stageVideoLink.style.top=y+'px';stageVideoLink.style.width=size+'px';stageVideoLink.style.height=size+'px';stageVideoLink.style.transform='none';}
function updateVideoLink(){if(!stageVideoLink)return;const url=strokeVideoLinks[current];stageVideoLink.classList.toggle('show',!!url);if(url)stageVideoLink.href=url;positionVideoLink();}
function resizeStage(){if(document.body.classList.contains('presenting')){const s=Math.min(window.innerWidth/960,window.innerHeight/540);document.documentElement.style.setProperty('--present-scale',s);positionVideoLink();return;}const sidebarSpace=window.innerWidth>900?284:48;const s=Math.min(1,(window.innerWidth-sidebarSpace)/960,(window.innerHeight-204)/540);stage.style.transform='scale('+Math.max(.48,s)+')';positionVideoLink();}
function saveText(){slideText[current]=Array.from(slideSurface.querySelectorAll('.text-annotation')).map(el=>({left:el.style.left,top:el.style.top,width:el.style.width,height:el.style.height,text:el.innerText}));}
function saveCanvas(){slideDrawings[current]=canvas.toDataURL();saveText();}
function restoreCanvas(){ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);const dpr=window.devicePixelRatio||1;ctx.setTransform(dpr,0,0,dpr,0,0);if(slideDrawings[current]){const img=new Image();img.onload=()=>{ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);ctx.setTransform(dpr,0,0,dpr,0,0);};img.src=slideDrawings[current];}}
function restoreText(){slideSurface.querySelectorAll('.text-annotation').forEach(el=>el.remove());(slideText[current]||[]).forEach(d=>createTextBox(d));}
function slideName(file){return file.replace(/^\d+-/,'').replace(/\.html$/,'').replace(/-/g,' ');}
function loadThumb(iframe){if(iframe&&!iframe.getAttribute('src'))iframe.src=iframe.dataset.src;}
function buildThumbnails(){thumbList.innerHTML='';if('IntersectionObserver' in window)thumbObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting)loadThumb(entry.target.querySelector('iframe'));}),{root:thumbList,rootMargin:'240px 0px'});MANIFEST.forEach((file,i)=>{const btn=document.createElement('button');btn.className='thumb-button';btn.type='button';btn.setAttribute('aria-label','Slide '+(i+1)+': '+slideName(file));btn.addEventListener('click',()=>goToSlide(i));const num=document.createElement('span');num.className='thumb-number';num.textContent=String(i+1).padStart(2,'0');const preview=document.createElement('span');preview.className='thumb-preview';const iframe=document.createElement('iframe');iframe.dataset.src=file;iframe.title='Slide '+(i+1);iframe.tabIndex=-1;iframe.loading='lazy';preview.appendChild(iframe);const name=document.createElement('span');name.className='thumb-name';name.textContent=slideName(file);btn.append(num,preview,name);thumbList.appendChild(btn);if(i<6||!thumbObserver)loadThumb(iframe);if(thumbObserver)thumbObserver.observe(btn);});}
function updateThumbnails(){const buttons=thumbList.querySelectorAll('.thumb-button');buttons.forEach((btn,i)=>{btn.classList.toggle('active',i===current);btn.setAttribute('aria-current',i===current?'true':'false');});const active=buttons[current];if(active){loadThumb(active.querySelector('iframe'));requestAnimationFrame(()=>active.scrollIntoView({block:'nearest'}));}}
function goToSlide(index){if(index===current)return;saveCanvas();current=index;update();}
function update(){frame.src=MANIFEST[current];document.getElementById('counter').textContent=(current+1)+' / '+MANIFEST.length;document.getElementById('counterFloat').textContent=(current+1)+' / '+MANIFEST.length;updateThumbnails();updateVideoLink();setTimeout(()=>{restoreCanvas();restoreText();},80);}
function prev(){if(current>0){saveCanvas();current--;update();}}function next(){if(current<MANIFEST.length-1){saveCanvas();current++;update();}}
function pushUndo(){(slideHistory[current]||(slideHistory[current]=[])).push(canvas.toDataURL());if(slideHistory[current].length>40)slideHistory[current].shift();}
function undo(){const h=slideHistory[current];if(!h||!h.length)return;const img=new Image();img.onload=()=>{ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);ctx.setTransform(window.devicePixelRatio||1,0,0,window.devicePixelRatio||1,0,0);saveCanvas();};img.src=h.pop();}
function closeEraserMenus(){document.querySelectorAll('.eraser-menu').forEach(menu=>menu.classList.remove('show'));}
function toggleEraserMenu(id){if(eraserMode!==null){setEraser(null);return;}const menu=document.getElementById(id);if(!menu)return;const show=!menu.classList.contains('show');closeEraserMenus();if(show)menu.classList.add('show');}
function setEraser(mode){eraserMode=mode;penActive=false;highlighterActive=false;textMode=false;closeEraserMenus();setTools();}
function setTools(){const eraserActive=eraserMode!==null, any=penActive||highlighterActive||eraserActive;canvas.classList.toggle('active',any);canvas.style.cursor=eraserMode==='object'?'pointer':eraserActive?'cell':any?'crosshair':'default';['penBtn','penBtnFloat'].forEach(id=>document.getElementById(id)?.classList.toggle('active',penActive));['highBtn','highBtnFloat'].forEach(id=>document.getElementById(id)?.classList.toggle('active',highlighterActive));['eraseBtn','eraseBtnFloat'].forEach(id=>document.getElementById(id)?.classList.toggle('active',eraserActive));['pixelEraserBtn','pixelEraserBtnFloat'].forEach(id=>document.getElementById(id)?.classList.toggle('active',eraserMode==='pixel'));['objectEraserBtn','objectEraserBtnFloat'].forEach(id=>document.getElementById(id)?.classList.toggle('active',eraserMode==='object'));['textBtn','textBtnFloat'].forEach(id=>document.getElementById(id)?.classList.toggle('active',textMode));}
function togglePen(){penActive=!penActive;highlighterActive=false;eraserMode=null;textMode=false;closeEraserMenus();setTools();}function toggleHighlighter(){highlighterActive=!highlighterActive;penActive=false;eraserMode=null;textMode=false;closeEraserMenus();setTools();}function toggleEraser(){setEraser(eraserMode?null:'pixel');}function toggleText(){textMode=!textMode;penActive=false;highlighterActive=false;eraserMode=null;closeEraserMenus();setTools();}
function pickColor(el){penColor=el.dataset.color;document.querySelectorAll('.swatch').forEach(s=>s.classList.toggle('selected',s.dataset.color===penColor));if(!penActive&&!highlighterActive){penActive=true;eraserMode=null;textMode=false;setTools();}}
function clearSlide(){pushUndo();ctx.clearRect(0,0,960,540);delete slideDrawings[current];slideSurface.querySelectorAll('.text-annotation').forEach(el=>el.remove());delete slideText[current];}
function getPos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*960,y:(e.clientY-r.top)/r.height*540};}
function startDraw(e){if(!penActive&&!highlighterActive&&eraserMode===null)return;drawing=true;pushUndo();const p=getPos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);}
function draw(e){if(!drawing)return;const p=getPos(e), eraserActive=eraserMode!==null;ctx.globalCompositeOperation=eraserActive?'destination-out':'source-over';ctx.globalAlpha=highlighterActive?.3:1;ctx.strokeStyle=penColor;ctx.lineWidth=eraserMode==='object'?42:eraserActive?28:highlighterActive?18:3;ctx.lineCap='round';ctx.lineJoin='round';ctx.lineTo(p.x,p.y);ctx.stroke();ctx.beginPath();ctx.moveTo(p.x,p.y);}
function endDraw(){if(!drawing)return;drawing=false;ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';saveCanvas();}
canvas.addEventListener('mousedown',startDraw);canvas.addEventListener('mousemove',draw);canvas.addEventListener('mouseup',endDraw);canvas.addEventListener('mouseleave',endDraw);
stageVideoLink?.addEventListener('click',e=>e.stopPropagation());
stage.addEventListener('click',e=>{if(textMode){const r=slideSurface.getBoundingClientRect();createTextBox({left:((e.clientX-r.left)/r.width*960)+'px',top:((e.clientY-r.top)/r.height*540)+'px',width:'220px',height:'64px',text:''});textMode=false;setTools();return;}if(!penActive&&!highlighterActive&&eraserMode===null)frame.contentWindow?.postMessage({type:'reveal-next'},'*');});
function createTextBox(d){const el=document.createElement('div');el.className='text-annotation';el.contentEditable='true';el.style.left=d.left;el.style.top=d.top;el.style.width=d.width;el.style.height=d.height;el.innerText=d.text||'';slideSurface.appendChild(el);setTimeout(()=>el.focus(),0);}
function enterPresent(){document.body.classList.add('presenting');thumbSidebar.classList.remove('open');document.documentElement.requestFullscreen?.();resizeStage();}function exitPresent(){document.body.classList.remove('presenting');thumbSidebar.classList.remove('open');document.exitFullscreen?.();resizeStage();}
document.addEventListener('click',e=>{if(!e.target.closest('.eraser-wrap'))closeEraserMenus();});
let thumbHideTimer=null;
function showThumbSidebar(){if(!document.body.classList.contains('presenting'))return;thumbSidebar.classList.add('open');clearTimeout(thumbHideTimer);thumbHideTimer=setTimeout(()=>{if(!thumbSidebar.matches(':hover'))thumbSidebar.classList.remove('open');},1800);}
document.addEventListener('mousemove',e=>{if(!document.body.classList.contains('presenting'))return;if(e.clientX<34){showThumbSidebar();return;}if(e.clientX>270&&!thumbSidebar.matches(':hover')){clearTimeout(thumbHideTimer);thumbHideTimer=setTimeout(()=>thumbSidebar.classList.remove('open'),420);}});
document.addEventListener('keydown',e=>{if(e.target.isContentEditable)return;if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev();if(e.key.toLowerCase()==='f')enterPresent();if(e.key==='Escape')exitPresent();if(e.key.toLowerCase()==='p')togglePen();if(e.key.toLowerCase()==='h')toggleHighlighter();if(e.key.toLowerCase()==='e')toggleEraser();if(e.key.toLowerCase()==='t')toggleText();if(e.key.toLowerCase()==='z')undo();if(e.key.toLowerCase()==='c')clearSlide();});
function hideExportOverlay(){const overlay=document.getElementById('exportOverlay');overlay.classList.remove('show','error');}
function setExportError(message){
  const overlay=document.getElementById('exportOverlay'),title=document.getElementById('exportTitle'),status=document.getElementById('exportStatus'),bar=document.getElementById('exportBar');
  title.textContent='PDF export needs localhost';
  status.textContent=message;
  bar.style.width='100%';
  overlay.classList.add('show','error');
}
function waitForFrameLoad(iframe, src, timeoutMs=10000){
  return new Promise((resolve,reject)=>{
    const timer=setTimeout(()=>reject(new Error('Timed out loading '+src)),timeoutMs);
    iframe.onload=()=>setTimeout(()=>{clearTimeout(timer);resolve();},700);
    iframe.onerror=()=>{clearTimeout(timer);reject(new Error('Could not load '+src));};
    iframe.src=src;
  });
}
async function exportPDF(){
  const overlay=document.getElementById('exportOverlay'),title=document.getElementById('exportTitle'),status=document.getElementById('exportStatus'),bar=document.getElementById('exportBar'),close=document.getElementById('exportClose');
  overlay.classList.remove('error');
  title.textContent='Exporting PDF...';
  status.textContent='Rendering slide 1 / '+MANIFEST.length;
  bar.style.width='0%';
  close.style.display='';
  overlay.classList.add('show');

  if(location.protocol==='file:'){
    setExportError('Open this lesson through a local server before exporting. From the project root, run: python3 -m http.server 8787, then open http://127.0.0.1:8787/output/book-1/lesson-01/');
    return;
  }

  // Flush current slide's live canvas + text to storage before exporting
  saveCanvas();

  const pdf=new window.jspdf.jsPDF({orientation:'landscape',unit:'px',format:[960,540]});

  // Hidden render iframe — off-screen, fixed 960×540
  const renderFrame=document.createElement('iframe');
  renderFrame.style.cssText='position:fixed;left:-9999px;top:0;width:960px;height:540px;border:0;pointer-events:none;';
  document.body.appendChild(renderFrame);

  // Offscreen canvas for compositing slide + drawing layer
  const offCanvas=document.createElement('canvas');
  offCanvas.width=960; offCanvas.height=540;
  const offCtx=offCanvas.getContext('2d');

  try{
    for(let i=0;i<MANIFEST.length;i++){
      if(i>0) pdf.addPage([960,540],'landscape');
      status.textContent='Rendering slide '+(i+1)+' / '+MANIFEST.length;
      bar.style.width=((i+1)/MANIFEST.length*100)+'%';

      // 1. Render slide HTML into hidden iframe
      await waitForFrameLoad(renderFrame, MANIFEST[i]);

      let slideDoc;
      try{
        slideDoc=renderFrame.contentDocument||renderFrame.contentWindow.document;
      }catch(err){
        throw new Error('Browser blocked slide access. Open the deck through localhost, not file://.');
      }
      if(!slideDoc||!slideDoc.body)throw new Error('Slide did not render: '+MANIFEST[i]);
      const slideCanvas=await html2canvas(slideDoc.body,{
        width:960,height:540,scale:1,
        useCORS:true,allowTaint:true,
        backgroundColor:'#ffffff',
        logging:false,
      });

      // 2. Composite: slide base + pen/highlighter drawing layer
      offCtx.clearRect(0,0,960,540);
      offCtx.drawImage(slideCanvas,0,0,960,540);

      if(slideDrawings[i]){
        await new Promise(resolve=>{
          const drawImg=new Image();
          drawImg.onload=()=>{
            // Drawing canvas is stored at DPR scale; draw it scaled down to 960x540.
            offCtx.drawImage(drawImg,0,0,960,540);
            resolve();
          };
          drawImg.onerror=resolve;
          drawImg.src=slideDrawings[i];
        });
      }

      // 3. Add composited slide to PDF
      pdf.addImage(offCanvas.toDataURL('image/png'),'PNG',0,0,960,540,undefined,'FAST');

      // 4. Render text box annotations as PDF text (preserves selectability + crispness)
      (slideText[i]||[]).forEach(t=>{
        const x=parseFloat(t.left)||0,y=parseFloat(t.top)||0,w=parseFloat(t.width)||220,h=parseFloat(t.height)||64,text=t.text||'';
        if(!text.trim())return;
        pdf.setFillColor(255,255,255,0.92);
        pdf.setDrawColor(90,172,172);
        pdf.setLineWidth(1.5);
        pdf.rect(x,y,w,h,'FD');
        pdf.setTextColor(26,58,90);
        pdf.setFontSize(16);
        pdf.text(pdf.splitTextToSize(text,w-16),x+8,y+20);
      });
    }

    pdf.save('pinyin-02-teacher-deck.pdf');
    hideExportOverlay();
  }catch(err){
    console.error(err);
    setExportError(err.message||'PDF export failed. Open through localhost and try again.');
  }finally{
    if(renderFrame.parentNode)document.body.removeChild(renderFrame);
  }
}
window.addEventListener('resize',resizeStage);resizeCanvas();buildThumbnails();update();
</script>
