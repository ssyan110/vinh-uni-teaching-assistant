<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=960,height=540">
  <title>Nghe rồi điền từ vào chỗ trống</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="assets/slide-base.css">
  <style>
    .listen-fill{
      position:absolute;
      left:58px;
      right:58px;
      top:80px;
      bottom:44px;
    }
    .listen-fill-title{
      display:flex;
      align-items:center;
      gap:22px;
      margin-bottom:52px;
      font-size:38px;
      line-height:1.08;
      font-weight:900;
      color:#1A3A5A;
      white-space:nowrap;
    }
    .listen-fill-title .vi{
      color:#3B7DB4;
    }
    .audio-badge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      height:36px;
      padding:0 13px;
      border-radius:10px;
      background:#3B7DB4;
      color:#fff;
      font-size:20px;
      font-weight:900;
      box-shadow:0 6px 14px rgba(59,125,180,.18);
      flex:none;
    }
    .audio-badge i{
      width:22px;
      height:22px;
      stroke-width:3;
    }
    .blank-grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      column-gap:54px;
      row-gap:54px;
    }
    .blank-item{
      display:flex;
      align-items:flex-end;
      gap:12px;
      min-width:0;
      font-size:31px;
      line-height:1;
      font-weight:500;
      color:#202530;
    }
    .blank-line{
      display:inline-block;
      width:154px;
      border-bottom:3px solid #202530;
      transform:translateY(-7px);
      flex:none;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="menu-bar">
      <span class="menu-icon"><i data-lucide="volume-2"></i></span>
      <span class="section-label">Ôn tập</span>
    </div>
    <div class="listen-fill">
      <div class="listen-fill-title">
        <span class="audio-badge"><i data-lucide="volume-2"></i>14-3-3</span>
        <span class="vi">Nghe rồi điền từ vào chỗ trống.</span>
      </div>
      <div class="blank-grid">
        <div class="blank-item"><span>1.</span><span class="blank-line"></span></div>
        <div class="blank-item"><span>2.</span><span class="blank-line"></span></div>
        <div class="blank-item"><span>3.</span><span class="blank-line"></span></div>
        <div class="blank-item"><span>4.</span><span class="blank-line"></span></div>
        <div class="blank-item"><span>5.</span><span class="blank-line"></span></div>
        <div class="blank-item"><span>6.</span><span class="blank-line"></span></div>
        <div class="blank-item"><span>7.</span><span class="blank-line"></span></div>
        <div class="blank-item"><span>8.</span><span class="blank-line"></span></div>
        <div class="blank-item"><span>9.</span><span class="blank-line"></span></div>
        <div class="blank-item"><span>10.</span><span class="blank-line"></span></div>
      </div>
    </div>
  </div>
  <script src="assets/slide-base.js"></script>
</body>
</html>
