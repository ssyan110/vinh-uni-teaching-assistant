<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=960, height=540">
  <title>Bài 1 · Luyện số</title>
  <link rel="stylesheet" href="shared/tokens.css">
  <style>
    body {
      align-items: center;
      gap: 20px;
    }
    .title {
      font-size: 24px;
      color: var(--text-primary);
      font-weight: 600;
    }
    .numbers {
      display: flex;
      align-items: baseline;
      gap: 48px;
      margin: 16px 0;
    }
    .number-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .number-group .hanzi {
      font-family: var(--font-zh);
      font-size: 72px;
      font-weight: 700;
      color: var(--text-primary);
    }
    .number-group .pinyin {
      font-size: 22px;
      color: var(--accent);
    }
    .dot {
      font-size: 48px;
      color: var(--text-muted);
      align-self: center;
    }
    .instruction {
      font-size: 16px;
      color: var(--text-secondary);
      margin-top: 12px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="title">Luyện số</div>
  <div class="numbers">
    <div class="number-group">
      <span class="hanzi">一</span>
      <span class="pinyin">yī</span>
    </div>
    <span class="dot">·</span>
    <div class="number-group">
      <span class="hanzi">五</span>
      <span class="pinyin">wǔ</span>
    </div>
    <span class="dot">·</span>
    <div class="number-group">
      <span class="hanzi">八</span>
      <span class="pinyin">bā</span>
    </div>
  </div>
  <div class="instruction">Giảng viên giơ ngón tay → Sinh viên đọc tiếng Trung</div>
  <div class="page-footer"></div>
</body>
</html>
