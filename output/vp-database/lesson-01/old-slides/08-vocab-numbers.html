<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Số từ: 一 五 八</title>
  <link rel="stylesheet" href="shared/tokens.css">
  <style>
    body {
      justify-content: center;
      align-items: center;
    }
    .columns {
      display: flex;
      gap: 60px;
      align-items: center;
      justify-content: center;
      width: 100%;
    }
    .col {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 6px;
      flex: 1;
    }
    .col .pinyin {
      font-size: 26px;
      color: var(--accent);
    }
    .col .character {
      font-family: var(--font-zh);
      font-size: 88px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.2;
    }
    .col .meaning {
      font-size: 20px;
      color: var(--text-secondary);
      margin-top: 4px;
    }
    .word-type-label {
      font-size: 14px;
      color: var(--accent);
      border: 1px solid var(--accent-deep);
      padding: 2px 10px;
      border-radius: 3px;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <div class="columns">
    <div class="col">
      <span class="pinyin">yī</span>
      <span class="character">一</span>
      <span class="meaning">một</span>
    </div>
    <div class="col">
      <span class="pinyin">wǔ</span>
      <span class="character">五</span>
      <span class="meaning">năm</span>
    </div>
    <div class="col">
      <span class="pinyin">bā</span>
      <span class="character">八</span>
      <span class="meaning">tám</span>
    </div>
  </div>
  <div class="word-type-label">数 từ (số từ)</div>
  <div class="page-footer">p.19</div>
</body>
</html>
