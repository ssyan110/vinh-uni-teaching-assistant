<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=960, height=540">
  <title>Bài 1 · 不 + tính từ</title>
  <link rel="stylesheet" href="shared/tokens.css">
  <style>
    body {
      align-items: center;
      gap: 20px;
    }
    .title {
      font-size: 24px;
      color: var(--text-primary);
      font-weight: 600;
    }
    .rows {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 12px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .hanzi {
      font-family: var(--font-zh);
      font-size: 42px;
      font-weight: 700;
      color: var(--text-primary);
      min-width: 80px;
      text-align: center;
    }
    .arrow {
      font-size: 28px;
      color: var(--accent);
    }
    .negated {
      font-family: var(--font-zh);
      font-size: 42px;
      font-weight: 700;
      color: var(--text-primary);
      min-width: 100px;
      text-align: center;
    }
    .meaning {
      font-size: 16px;
      color: var(--text-secondary);
      margin-left: 16px;
    }
  </style>
</head>
<body>
  <div class="title">不 + tính từ</div>
  <div class="rows">
    <div class="row">
      <span class="hanzi">好</span>
      <span class="arrow">→</span>
      <span class="negated">不好</span>
      <span class="meaning">tốt → không tốt</span>
    </div>
    <div class="row">
      <span class="hanzi">大</span>
      <span class="arrow">→</span>
      <span class="negated">不大</span>
      <span class="meaning">lớn → không lớn</span>
    </div>
    <div class="row">
      <span class="hanzi">白</span>
      <span class="arrow">→</span>
      <span class="negated">不白</span>
      <span class="meaning">trắng → không trắng</span>
    </div>
  </div>
  <div class="page-footer"></div>
</body>
</html>
