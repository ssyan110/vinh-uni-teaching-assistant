<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=960, height=540">
  <title>Bài 1 · Blooket</title>
  <link rel="stylesheet" href="shared/tokens.css">
  <style>
    body {
      align-items: center;
      gap: 20px;
    }
    .title {
      font-size: 24px;
      color: var(--text-primary);
      font-weight: 600;
    }
    .qr-placeholder {
      width: 200px;
      height: 200px;
      border: 2px dashed var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 18px;
      margin: 12px 0;
    }
    .instruction {
      font-size: 16px;
      color: var(--text-secondary);
    }
    .link {
      font-size: 18px;
      color: var(--accent);
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="title">Blooket: Flashcard Race</div>
  <div class="qr-placeholder">QR Code</div>
  <div class="instruction">Quét mã để tham gia trò chơi</div>
  <div class="link">blooket.com/play</div>
  <div class="page-footer"></div>
</body>
</html>
