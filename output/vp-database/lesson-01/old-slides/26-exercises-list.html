<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=960, height=540">
  <title>Bài 1 · Bài tập trong sách</title>
  <link rel="stylesheet" href="shared/tokens.css">
  <style>
    body {
      align-items: flex-start;
      gap: 16px;
    }
    .title {
      font-size: 24px;
      color: var(--text-primary);
      font-weight: 600;
    }
    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
    }
    .list-item {
      display: flex;
      align-items: baseline;
      gap: 12px;
      font-size: 18px;
    }
    .list-item .num {
      color: var(--accent);
      font-weight: 700;
      font-family: var(--font-mono);
      min-width: 24px;
    }
    .list-item .text {
      color: var(--text-primary);
    }
  </style>
</head>
<body>
  <div class="title">Bài tập trong sách</div>
  <div class="list">
    <div class="list-item"><span class="num">1.</span><span class="text">Luyện thanh điệu (p.28)</span></div>
    <div class="list-item"><span class="num">2.</span><span class="text">Luyện biến điệu (p.28)</span></div>
    <div class="list-item"><span class="num">3.</span><span class="text">Phân biệt thanh mẫu (p.28)</span></div>
    <div class="list-item"><span class="num">4.</span><span class="text">Phân biệt vận mẫu (p.29)</span></div>
    <div class="list-item"><span class="num">5.</span><span class="text">Phân biệt âm và thanh điệu (p.29)</span></div>
    <div class="list-item"><span class="num">6.</span><span class="text">Nhận mặt chữ và đọc (p.29)</span></div>
    <div class="list-item"><span class="num">7.</span><span class="text">Tập viết chữ Hán (p.30)</span></div>
  </div>
  <div class="page-footer">p.28-30</div>
</body>
</html>
