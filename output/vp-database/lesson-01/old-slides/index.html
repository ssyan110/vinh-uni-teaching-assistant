<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Bài 1 · 你好 · Xin chào — Teacher Deck</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100vw; height: 100vh; overflow: hidden; background: #000; font-family: -apple-system, sans-serif; }
iframe { width: 100%; height: 100%; border: none; }
.controls { position: fixed; bottom: 16px; right: 24px; display: flex; gap: 12px; align-items: center; z-index: 999; }
.controls button { background: rgba(160,128,64,0.2); border: 1px solid rgba(160,128,64,0.4); color: #A08040; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 14px; }
.controls button:hover { background: rgba(160,128,64,0.4); }
.counter { color: #606050; font-size: 13px; font-family: "SF Mono", monospace; }
</style>
</head>
<body>
<iframe id="slide-frame"></iframe>
<div class="controls">
  <button onclick="prev()">← Prev</button>
  <span class="counter" id="counter">1 / 28</span>
  <button onclick="next()">Next →</button>
</div>
<script>
const MANIFEST = [
  { file: "01-cover.html", label: "Cover" },
  { file: "02-objectives.html", label: "Mục tiêu" },
  { file: "03-warmup.html", label: "Khởi động" },
  { file: "04-divider-vocab.html", label: "Divider: Từ vựng" },
  { file: "05-vocab-ni.html", label: "你 nǐ" },
  { file: "06-vocab-hao.html", label: "好 hǎo" },
  { file: "07-vocab-nihao.html", label: "你好" },
  { file: "08-vocab-numbers.html", label: "一五八" },
  { file: "09-vocab-da.html", label: "大 dà" },
  { file: "10-vocab-bu.html", label: "不 bù" },
  { file: "11-vocab-kou.html", label: "口 kǒu" },
  { file: "12-vocab-bai.html", label: "白 bái" },
  { file: "13-vocab-nu.html", label: "女 nǚ" },
  { file: "14-vocab-ma.html", label: "马 mǎ" },
  { file: "15-vocab-summary.html", label: "Tổng hợp" },
  { file: "16-divider-text.html", label: "Divider: Bài đọc" },
  { file: "17-text-dialogue.html", label: "Hội thoại" },
  { file: "18-divider-practice.html", label: "Divider: Luyện tập" },
  { file: "19-practice-flashcards.html", label: "Ghép thẻ" },
  { file: "20-practice-numbers.html", label: "Luyện số" },
  { file: "21-practice-negation.html", label: "不 + tính từ" },
  { file: "22-practice-blooket.html", label: "Blooket" },
  { file: "23-divider-culture.html", label: "Divider: Văn hóa" },
  { file: "24-culture-greetings.html", label: "Chào hỏi" },
  { file: "25-divider-exercises.html", label: "Divider: Bài tập" },
  { file: "26-exercises-list.html", label: "Bài tập" },
  { file: "27-homework.html", label: "Bài tập về nhà" },
  { file: "28-closing.html", label: "Kết thúc" },
];

let current = parseInt(localStorage.getItem('lesson01-slide') || '0', 10);
const frame = document.getElementById('slide-frame');
const counter = document.getElementById('counter');

function goTo(n) {
  current = Math.max(0, Math.min(n, MANIFEST.length - 1));
  frame.src = MANIFEST[current].file;
  counter.textContent = `${current + 1} / ${MANIFEST.length}`;
  localStorage.setItem('lesson01-slide', current);
}

function next() { goTo(current + 1); }
function prev() { goTo(current - 1); }

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
  if (e.key === 'Home') { e.preventDefault(); goTo(0); }
  if (e.key === 'End') { e.preventDefault(); goTo(MANIFEST.length - 1); }
});

goTo(current);
</script>
</body>
</html>
