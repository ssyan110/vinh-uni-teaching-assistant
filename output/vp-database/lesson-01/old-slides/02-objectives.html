<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=960, height=540">
  <title>Bài 1 · Mục tiêu</title>
  <link rel="stylesheet" href="shared/tokens.css">
  <style>
    body {
      justify-content: flex-start;
      padding-top: 80px;
    }
    .slide-title {
      font-size: 28px;
      color: var(--text-primary);
      font-weight: 600;
      margin-bottom: 40px;
    }
    .objectives-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .objectives-list li {
      display: flex;
      align-items: baseline;
      gap: 14px;
      font-size: 20px;
      color: var(--text-secondary);
      line-height: 1.6;
    }
    .objectives-list li::before {
      content: "●";
      color: var(--accent);
      font-size: 12px;
      flex-shrink: 0;
      position: relative;
      top: -1px;
    }
    .objectives-list .zh {
      font-family: var(--font-zh);
      color: var(--text-primary);
    }
  </style>
</head>
<body>
  <h1 class="slide-title">Hôm nay bạn sẽ học gì?</h1>
  <ul class="objectives-list">
    <li>Chào hỏi bằng tiếng Trung: <span class="zh">你好</span></li>
    <li>Nhận biết và đọc 12 từ vựng cơ bản</li>
    <li>Viết chữ Hán đơn giản: <span class="zh">一八大不五口白女马你好</span></li>
  </ul>
  <div class="page-footer"></div>
</body>
</html>
