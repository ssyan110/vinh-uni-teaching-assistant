<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=960, height=540">
  <title>Bài 1 · Hội thoại</title>
  <link rel="stylesheet" href="shared/tokens.css">
  <style>
    body {
      align-items: center;
      gap: 0;
    }
    .dialogue {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 48px;
      margin-bottom: 24px;
    }
    .speaker {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .speaker .label {
      font-size: 18px;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }
    .speaker .hanzi {
      font-family: var(--font-zh);
      font-size: 72px;
      font-weight: 700;
      color: var(--text-primary);
    }
    .arrow {
      font-size: 36px;
      color: var(--accent);
      opacity: 0.6;
    }
    .pinyin-line {
      font-size: 20px;
      color: var(--accent);
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="dialogue">
    <div class="speaker">
      <span class="label">A:</span>
      <span class="hanzi">你好</span>
    </div>
    <div class="arrow">⟷</div>
    <div class="speaker">
      <span class="label">B:</span>
      <span class="hanzi">你好</span>
    </div>
  </div>
  <div class="pinyin-line">nǐ hǎo / nǐ hǎo</div>
  <div class="page-footer">p.19</div>
</body>
</html>
