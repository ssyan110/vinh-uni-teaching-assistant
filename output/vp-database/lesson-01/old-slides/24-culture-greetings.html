<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=960, height=540">
  <title>Bài 1 · Cách chào hỏi</title>
  <link rel="stylesheet" href="shared/tokens.css">
  <style>
    body {
      align-items: stretch;
      gap: 20px;
    }
    .title {
      font-size: 24px;
      color: var(--text-primary);
      font-weight: 600;
      text-align: center;
    }
    .columns {
      display: flex;
      flex: 1;
      align-items: center;
      justify-content: center;
      gap: 0;
    }
    .column {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 0 32px;
    }
    .column .header {
      font-size: 20px;
      color: var(--accent);
      font-weight: 600;
    }
    .column .main-text {
      font-size: 28px;
      color: var(--text-primary);
      font-family: var(--font-body);
    }
    .column .main-text-zh {
      font-family: var(--font-zh);
      font-size: 48px;
      font-weight: 700;
      color: var(--text-primary);
    }
    .column .note {
      font-size: 14px;
      color: var(--text-secondary);
    }
    .divider-line {
      width: 2px;
      height: 160px;
      background: var(--accent);
      opacity: 0.5;
    }
    .bottom-note {
      font-size: 14px;
      color: var(--text-muted);
      text-align: center;
      margin-top: auto;
      padding-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="title">Cách chào hỏi</div>
  <div class="columns">
    <div class="column">
      <span class="header">Việt Nam</span>
      <span class="main-text">Chào anh/chị/em</span>
      <span class="note">(theo tuổi và quan hệ)</span>
    </div>
    <div class="divider-line"></div>
    <div class="column">
      <span class="header">Trung Quốc</span>
      <span class="main-text-zh">你好</span>
      <span class="note">(cho mọi người)</span>
    </div>
  </div>
  <div class="bottom-note">您好 nín hǎo = dạng lịch sự hơn (sẽ học ở bài sau)</div>
  <div class="page-footer"></div>
</body>
</html>
