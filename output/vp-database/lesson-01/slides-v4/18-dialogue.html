<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=960, height=540">
<title>Slide 17 – Hội thoại</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #F0F8F4, #F4F8FF); width: 960px; height: 540px; overflow: hidden; position: relative; }
.menu-bar { position: absolute; top: 0; left: 0; right: 0; height: 36px; background: rgba(255,255,255,0.88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.06); display: flex; align-items: center; padding: 0 28px; z-index: 10; }
.menu-bar .dot { width: 8px; height: 8px; border-radius: 50%; background: #10B981; margin-right: 10px; }
.menu-bar .section-label { font-size: 9pt; font-weight: 600; color: #4A6080; text-transform: uppercase; letter-spacing: 1px; }
.page-indicator { position: absolute; bottom: 16px; right: 28px; font-size: 9pt; color: #8A9AB0; }
.content { padding: 56px 48px 48px; }
h1 { font-size: 20pt; color: #1A3A5A; font-weight: 700; margin-bottom: 28px; }
.dialogue { display: flex; flex-direction: column; gap: 24px; max-width: 500px; margin: 0 auto; }
.block { background: #FFFFFF; border-radius: 16px; padding: 24px; box-shadow: 0 4px 24px rgba(90,172,172,0.10); }
.block-a { border-left: 4px solid #5AACAC; }
.block-b { border-left: 4px solid #B8C8E8; }
.speaker-a { font-size: 12pt; font-weight: 700; color: #5AACAC; margin-bottom: 8px; }
.speaker-b { font-size: 12pt; font-weight: 700; color: #7090B0; margin-bottom: 8px; }
.pinyin-a { font-size: 16pt; color: #5AACAC; margin-bottom: 4px; }
.pinyin-b { font-size: 16pt; color: #7090B0; margin-bottom: 4px; }
.hanzi { font-family: 'Noto Sans SC', sans-serif; font-size: 28pt; font-weight: 700; color: #1A3A5A; }
</style>
</head>
<body>
<div class="menu-bar"><span class="dot"></span><span class="section-label">BÀI ĐỌC</span></div>
<div class="page-indicator">17 / 29</div>
<div class="content">
  <h1>Hội thoại</h1>
  <div class="dialogue">
    <div class="block block-a">
      <div class="speaker-a">A:</div>
      <div class="pinyin-a">nǐ hǎo</div>
      <div class="hanzi">你好</div>
    </div>
    <div class="block block-b">
      <div class="speaker-b">B:</div>
      <div class="pinyin-b">nǐ hǎo</div>
      <div class="hanzi">你好</div>
    </div>
  </div>
</div>
</body>
</html>
