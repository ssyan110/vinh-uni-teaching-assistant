<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=960, height=540">
<title>Bài 1 · 一五八</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; width: 960px; height: 540px; overflow: hidden; position: relative; background: linear-gradient(to top, #F4FAFA, #FFFFFF); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
.menu-bar { position: absolute; top: 0; left: 0; right: 0; height: 36px; background: rgba(255,255,255,0.88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.06); display: flex; align-items: center; padding: 0 28px; z-index: 10; }
.menu-bar .dot { width: 8px; height: 8px; border-radius: 50%; background: #5AACAC; margin-right: 10px; }
.menu-bar .section-label { font-size: 9pt; font-weight: 600; color: #4A6080; text-transform: uppercase; letter-spacing: 1px; }
.page-indicator { position: absolute; bottom: 16px; right: 28px; font-size: 9pt; color: #8A9AB0; }
.counter { display: inline-block; background: #E8F4F4; color: #5AACAC; font-size: 9pt; font-weight: 600; padding: 3px 12px; border-radius: 12px; }
.cards-row { display: flex; gap: 20px; }
.card { width: 220px; height: 260px; background: #FFFFFF; border-radius: 20px; padding: 24px; box-shadow: 0 4px 24px rgba(90,172,172,0.10); text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
.pinyin { font-size: 16pt; color: #5AACAC; font-weight: 500; }
.character { font-family: 'Noto Sans SC', sans-serif; font-weight: 900; font-size: 48pt; color: #1A3A5A; line-height: 1.1; }
.meaning { font-size: 13pt; color: #4A6080; }
.han-viet { font-size: 10pt; color: #8A9AB0; font-style: italic; }
.type-pill { display: inline-block; background: #E8F4F4; color: #5AACAC; font-size: 9pt; font-weight: 600; padding: 3px 12px; border-radius: 12px; }
</style>
</head>
<body>
<div class="menu-bar"><span class="dot"></span><span class="section-label">TỪ VỰNG</span></div>
<div class="page-indicator">8 / 29</div>
<span class="counter">04-06/12</span>
<div class="cards-row">
  <div class="card">
    <div class="pinyin">yī</div>
    <div class="character">一</div>
    <div class="meaning">một</div>
    <div class="han-viet">(nhất)</div>
  </div>
  <div class="card">
    <div class="pinyin">wǔ</div>
    <div class="character">五</div>
    <div class="meaning">năm</div>
    <div class="han-viet">(ngũ)</div>
  </div>
  <div class="card">
    <div class="pinyin">bā</div>
    <div class="character">八</div>
    <div class="meaning">tám</div>
    <div class="han-viet">(bát)</div>
  </div>
</div>
<span class="type-pill">số từ</span>
</body>
</html>
