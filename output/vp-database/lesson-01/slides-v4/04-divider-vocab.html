<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=960, height=540">
<title>Bai 1 - Từ vựng</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; width: 960px; height: 540px; overflow: hidden; position: relative; display: flex; }
.menu-bar { position: absolute; top: 0; left: 0; right: 0; height: 36px; background: rgba(255,255,255,0.88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.06); display: flex; align-items: center; padding: 0 28px; z-index: 10; }
.menu-bar .dot { width: 8px; height: 8px; border-radius: 50%; background: #5AACAC; margin-right: 10px; }
.menu-bar .section-label { font-size: 9pt; font-weight: 600; color: #4A6080; text-transform: uppercase; letter-spacing: 1px; }
.page-indicator { position: absolute; bottom: 16px; right: 28px; font-size: 9pt; color: #8A9AB0; }
.left { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #FFFFFF; padding: 40px; }
.right { width: 40%; background: linear-gradient(180deg, #D4EDED, #E8F4F4); border-radius: 20px 0 0 20px; }
.label { font-size: 11pt; color: #5AACAC; text-transform: uppercase; letter-spacing: 3px; font-weight: 600; margin-bottom: 12px; }
.zh-title { font-family: 'Noto Sans SC', sans-serif; font-weight: 900; font-size: 48pt; color: #1A3A5A; margin-bottom: 16px; }
.line { width: 40px; height: 3px; background: #5AACAC; margin-bottom: 16px; }
.subtitle { font-size: 14pt; color: #8A9AB0; }
</style>
</head>
<body>
<div class="menu-bar"><span class="dot"></span><span class="section-label">TỪ VỰNG</span></div>
<div class="page-indicator">4 / 29</div>
<div class="left">
  <div class="label">TỪ VỰNG</div>
  <div class="zh-title">生詞</div>
  <div class="line"></div>
  <div class="subtitle">12 từ mới</div>
</div>
<div class="right"></div>
</body>
</html>
