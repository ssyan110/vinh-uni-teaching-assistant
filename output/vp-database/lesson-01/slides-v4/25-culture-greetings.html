<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=960">
<title>Văn hóa – Cách chào hỏi</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; background: #fff; width: 960px; height: 540px; position: relative; overflow: hidden; }
.menu-bar { position: absolute; top: 0; left: 0; right: 0; height: 36px; background: rgba(255,255,255,0.88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.06); display: flex; align-items: center; padding: 0 28px; z-index: 10; }
.menu-bar .dot { width: 8px; height: 8px; border-radius: 50%; background: #EC4899; margin-right: 10px; }
.menu-bar .section-label { font-size: 9pt; font-weight: 600; color: #4A6080; text-transform: uppercase; letter-spacing: 1px; }
.page-indicator { position: absolute; bottom: 16px; right: 28px; font-size: 9pt; color: #8A9AB0; }
.content { padding: 48px; padding-top: 56px; }
.title { font-size: 20pt; color: #1A3A5A; font-weight: 700; }
.cards { display: flex; gap: 24px; margin-top: 24px; }
.card { flex: 1; background: #F8FCFC; border-radius: 16px; padding: 28px; }
.card-vn { border-top: 3px solid #EC4899; }
.card-cn { border-top: 3px solid #5AACAC; }
.card .country { font-size: 14pt; font-weight: 700; margin-bottom: 8px; }
.card-vn .country { color: #EC4899; }
.card-cn .country { color: #5AACAC; }
.card .phrase { font-size: 18pt; color: #1A3A5A; }
.card .pinyin { font-size: 14pt; color: #5AACAC; }
.card .hanzi { font-family: 'Noto Sans SC', sans-serif; font-weight: 700; font-size: 28pt; color: #1A3A5A; margin-top: 4px; }
.card .note { font-size: 12pt; color: #8A9AB0; margin-top: 6px; }
.footer-note { text-align: center; font-size: 11pt; color: #8A9AB0; margin-top: 24px; }
</style>
</head>
<body>
<div class="menu-bar"><span class="dot"></span><span class="section-label">VĂN HÓA</span></div>
<div class="page-indicator">24 / 29</div>
<div class="content">
  <div class="title">Cách chào hỏi</div>
  <div class="cards">
    <div class="card card-vn">
      <div class="country">Việt Nam</div>
      <div class="phrase">Chào anh/chị/em</div>
      <div class="note">(theo tuổi và quan hệ)</div>
    </div>
    <div class="card card-cn">
      <div class="country">Trung Quốc</div>
      <div style="font-family:'Noto Sans SC',sans-serif;font-size:28pt;font-weight:700;color:#1A3A5A;">你好<span style="font-size:14pt;color:#5AACAC;font-weight:400;">(nǐ hǎo)</span></div>
      <div class="note">(cho mọi người)</div>
    </div>
  </div>
  <div class="footer-note">您好(nín hǎo) = dạng lịch sự hơn (sẽ học ở bài sau)</div>
</div>
</body>
</html>
