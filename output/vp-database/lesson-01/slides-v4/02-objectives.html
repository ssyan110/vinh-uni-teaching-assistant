<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=960, height=540">
    <title>Bài 1 - Mục tiêu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { margin: 0; padding: 0; width: 960px; height: 540px; overflow: hidden; }
        .slide {
            width: 960px;
            height: 540px;
            background: #FFFFFF;
            font-family: 'Inter', sans-serif;
            position: relative;
            overflow: hidden;
            display: flex;
        }
        .section-title {
            position: absolute;
            top: 16px;
            left: 28px;
            font-size: 10pt;
            font-weight: 600;
            color: #5AACAC;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .page-indicator {
            position: absolute;
            bottom: 16px;
            right: 28px;
            font-size: 9pt;
            color: #8A9AB0;
        }
        .left-content {
            flex: 1;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .title {
            font-size: 24pt;
            font-weight: 700;
            color: #1A3A5A;
            margin-bottom: 28px;
        }
        .cards {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .card {
            background: #F8FCFC;
            border: 1px solid #E0ECEC;
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .card-number {
            width: 24px;
            height: 24px;
            background: #5AACAC;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            flex-shrink: 0;
        }
        .card-text {
            font-size: 14pt;
            color: #4A6080;
            line-height: 1.4;
        }
        .right-panel {
            width: 35%;
            background: linear-gradient(180deg, #E0F2F2, #E8ECF8);
            border-radius: 20px 0 0 20px;
        }
    </style>
</head>
<body>
    <div class="slide">
        <span class="section-title">MỤC TIÊU</span>
        <span class="page-indicator">2 / 29</span>
        <div class="left-content">
            <div class="title">Hôm nay bạn sẽ học gì?</div>
            <div class="cards">
                <div class="card">
                    <div class="card-number">1</div>
                    <div class="card-text">Chào hỏi bằng tiếng Trung: 你好</div>
                </div>
                <div class="card">
                    <div class="card-number">2</div>
                    <div class="card-text">Nhận biết và đọc 12 từ vựng cơ bản</div>
                </div>
                <div class="card">
                    <div class="card-number">3</div>
                    <div class="card-text">Viết chữ Hán: 一、八、大、不、五、口、白、女、马、你、好</div>
                </div>
            </div>
        </div>
        <div class="right-panel"></div>
    </div>
</body>
</html>
