<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=960, height=540">
    <title>Bài 1 - 你好 - Cover</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { margin: 0; padding: 0; width: 960px; height: 540px; overflow: hidden; }
        .slide {
            width: 960px;
            height: 540px;
            background: linear-gradient(135deg, #E0F2F2, #E8ECF8);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .pill {
            background: #D4EDED;
            color: #3A8A8A;
            font-size: 11pt;
            font-weight: 600;
            padding: 6px 18px;
            border-radius: 20px;
            letter-spacing: 1px;
        }
        .character {
            font-family: 'Noto Sans SC', sans-serif;
            font-weight: 900;
            font-size: 80pt;
            color: #1A3A5A;
            line-height: 1.1;
        }
        .pinyin {
            font-size: 18pt;
            color: #5AACAC;
            font-weight: 500;
        }
        .divider {
            width: 40px;
            height: 2px;
            background: #C8E0E0;
        }
        .meaning {
            font-size: 18pt;
            color: #4A6080;
            font-weight: 500;
        }
        .subtitle {
            font-size: 11pt;
            color: #8A9AB0;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="slide">
        <div class="content">
            <span class="pill">BÀI 1</span>
            <div class="character">你好</div>
            <div class="pinyin">nǐ hǎo</div>
            <div class="divider"></div>
            <div class="meaning">Xin chào</div>
            <div class="subtitle">Giáo trình Hán ngữ · Sơ cấp</div>
        </div>
    </div>
</body>
</html>
