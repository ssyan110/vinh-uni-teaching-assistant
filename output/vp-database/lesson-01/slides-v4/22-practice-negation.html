<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=960">
<title>Luyện tập – Phủ định</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; background: #fff; width: 960px; height: 540px; position: relative; overflow: hidden; }
.menu-bar { position: absolute; top: 0; left: 0; right: 0; height: 36px; background: rgba(255,255,255,0.88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.06); display: flex; align-items: center; padding: 0 28px; z-index: 10; }
.menu-bar .dot { width: 8px; height: 8px; border-radius: 50%; background: #8B5CF6; margin-right: 10px; }
.menu-bar .section-label { font-size: 9pt; font-weight: 600; color: #4A6080; text-transform: uppercase; letter-spacing: 1px; }
.page-indicator { position: absolute; bottom: 16px; right: 28px; font-size: 9pt; color: #8A9AB0; }
.content { padding: 48px; padding-top: 56px; }
.title { font-size: 20pt; color: #1A3A5A; font-weight: 700; }
.instruction { font-size: 14pt; color: #4A6080; margin-top: 8px; }
.cards { display: flex; gap: 24px; margin-top: 28px; }
.card { background: #F8FCFC; border-radius: 16px; padding: 24px 32px; text-align: center; border: 1px solid #E0ECEC; flex: 1; }
.card .pinyin { font-size: 16pt; color: #5AACAC; margin-bottom: 4px; }
.card .hanzi { font-size: 48pt; color: #1A3A5A; font-family: 'Noto Sans SC', sans-serif; font-weight: 900; line-height: 1.2; }
.card .meaning { font-size: 12pt; color: #8A9AB0; margin-top: 4px; }
.formula { text-align: center; margin-top: 28px; font-size: 16pt; color: #8B5CF6; font-weight: 600; }
</style>
</head>
<body>
<div class="menu-bar"><span class="dot"></span><span class="section-label">LUYỆN TẬP</span></div>
<div class="page-indicator">21 / 29</div>
<div class="content">
  <div class="title">不(bù) + tính từ</div>
  <div class="instruction">Thêm 不 vào trước tính từ để tạo dạng phủ định</div>
  <div class="cards">
    <div class="card">
      <div class="pinyin">hǎo</div>
      <div class="hanzi">好</div>
      <div class="meaning">tốt</div>
    </div>
    <div class="card">
      <div class="pinyin">dà</div>
      <div class="hanzi">大</div>
      <div class="meaning">lớn</div>
    </div>
    <div class="card">
      <div class="pinyin">bái</div>
      <div class="hanzi">白</div>
      <div class="meaning">trắng</div>
    </div>
  </div>
  <div class="formula">→ 好 + 不 = ?</div>
</div>
</body>
</html>
