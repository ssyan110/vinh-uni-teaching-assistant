<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=960">
<title>Luyện tập – Blooket</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #F5F0FF, #F8F4FF); width: 960px; height: 540px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.menu-bar { position: absolute; top: 0; left: 0; right: 0; height: 36px; background: rgba(255,255,255,0.88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.06); display: flex; align-items: center; padding: 0 28px; z-index: 10; }
.menu-bar .dot { width: 8px; height: 8px; border-radius: 50%; background: #8B5CF6; margin-right: 10px; }
.menu-bar .section-label { font-size: 9pt; font-weight: 600; color: #4A6080; text-transform: uppercase; letter-spacing: 1px; }
.page-indicator { position: absolute; bottom: 16px; right: 28px; font-size: 9pt; color: #8A9AB0; }
.card { background: #fff; max-width: 400px; border-radius: 20px; padding: 40px; box-shadow: 0 4px 24px rgba(90,172,172,0.10); text-align: center; }
.card .title { font-size: 20pt; color: #1A3A5A; font-weight: 700; }
.card .subtitle { font-size: 14pt; color: #8B5CF6; margin-top: 6px; }
.qr-box { width: 160px; height: 160px; border: 2px dashed #B8A8E8; border-radius: 12px; margin: 20px auto; display: flex; align-items: center; justify-content: center; }
.qr-box span { font-size: 14pt; color: #8A9AB0; }
.card .cta { font-size: 13pt; color: #4A6080; margin-top: 16px; }
.card .link { font-size: 12pt; color: #8B5CF6; margin-top: 6px; }
</style>
</head>
<body>
<div class="menu-bar"><span class="dot"></span><span class="section-label">LUYỆN TẬP</span></div>
<div class="page-indicator">22 / 29</div>
<div class="card">
  <div class="title">Blooket</div>
  <div class="subtitle">Flashcard Race</div>
  <div class="qr-box"><span>QR Code</span></div>
  <div class="cta">Quét mã để tham gia</div>
  <div class="link">blooket.com/play</div>
</div>
</body>
</html>
