<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=960, height=540">
<title>Bài 1 · 你好</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; width: 960px; height: 540px; overflow: hidden; position: relative; background: linear-gradient(to top, #F4FAFA, #FFFFFF); display: flex; flex-direction: column; align-items: center; justify-content: center; }
.menu-bar { position: absolute; top: 0; left: 0; right: 0; height: 36px; background: rgba(255,255,255,0.88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.06); display: flex; align-items: center; padding: 0 28px; z-index: 10; }
.menu-bar .dot { width: 8px; height: 8px; border-radius: 50%; background: #5AACAC; margin-right: 10px; }
.menu-bar .section-label { font-size: 9pt; font-weight: 600; color: #4A6080; text-transform: uppercase; letter-spacing: 1px; }
.page-indicator { position: absolute; bottom: 16px; right: 28px; font-size: 9pt; color: #8A9AB0; }
.card { max-width: 400px; width: 100%; background: #FFFFFF; border-radius: 20px; padding: 32px 36px; box-shadow: 0 4px 24px rgba(90,172,172,0.10); text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; border-left: 4px solid #5AACAC; }
.counter { display: inline-block; background: #5AACAC; color: #FFFFFF; font-size: 9pt; font-weight: 600; padding: 3px 12px; border-radius: 12px; }
.pinyin { font-size: 20pt; color: #5AACAC; font-weight: 500; margin-top: 6px; }
.character { font-family: 'Noto Sans SC', sans-serif; font-weight: 900; font-size: 56pt; color: #1A3A5A; line-height: 1.1; }
.meaning { font-size: 14pt; color: #4A6080; margin-top: 4px; }
.han-viet { font-size: 11pt; color: #8A9AB0; font-style: italic; }
.type-pill { display: inline-block; background: #E8F4F4; color: #5AACAC; font-size: 9pt; font-weight: 600; padding: 3px 12px; border-radius: 12px; margin-top: 4px; }
.note { font-size: 10pt; color: #5AACAC; font-style: italic; margin-top: 4px; }
</style>
</head>
<body>
<div class="menu-bar"><span class="dot"></span><span class="section-label">TỪ VỰNG</span></div>
<div class="page-indicator">7 / 29</div>
<div class="card">
  <span class="counter">03/12 · CỤM TỪ CHÍNH</span>
  <div class="pinyin">nǐ hǎo</div>
  <div class="character">你好</div>
  <div class="meaning">Xin chào</div>
  <div class="han-viet">(nhĩ hảo)</div>
  <span class="type-pill">cụm từ</span>
  
</div>
</body>
</html>
