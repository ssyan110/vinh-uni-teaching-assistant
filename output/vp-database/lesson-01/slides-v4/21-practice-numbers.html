<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=960, height=540">
<title>Slide 20 – Luyện số</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; background: #FFFFFF; width: 960px; height: 540px; overflow: hidden; position: relative; padding: 48px; }
.menu-bar { position: absolute; top: 0; left: 0; right: 0; height: 36px; background: rgba(255,255,255,0.88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.06); display: flex; align-items: center; padding: 0 28px; z-index: 10; }
.menu-bar .dot { width: 8px; height: 8px; border-radius: 50%; background: #8B5CF6; margin-right: 10px; }
.menu-bar .section-label { font-size: 9pt; font-weight: 600; color: #4A6080; text-transform: uppercase; letter-spacing: 1px; }
.page-indicator { position: absolute; bottom: 16px; right: 28px; font-size: 9pt; color: #8A9AB0; }
h1 { font-size: 20pt; color: #1A3A5A; font-weight: 700; margin-bottom: 4px; margin-top: 12px; }
.instruction { font-size: 13pt; color: #8A9AB0; margin-bottom: 24px; }
.cards { display: flex; gap: 20px; margin-top: 24px; }
.num-card { flex: 1; background: #F8FCFC; border-radius: 16px; padding: 32px; text-align: center; border: 1px solid #E0ECEC; }
.num-pinyin { font-size: 18pt; color: #5AACAC; margin-bottom: 8px; }
.num-char { font-family: 'Noto Sans SC', sans-serif; font-size: 56pt; font-weight: 900; color: #1A3A5A; line-height: 1.1; margin-bottom: 8px; }
.num-meaning { font-size: 14pt; color: #8A9AB0; }
</style>
</head>
<body>
<div class="menu-bar"><span class="dot"></span><span class="section-label">LUYỆN TẬP</span></div>
<div class="page-indicator">20 / 29</div>
<h1>Luyện số</h1>
<div class="instruction">Giảng viên giơ ngón tay → Sinh viên đọc tiếng Trung</div>
<div class="cards">
  <div class="num-card">
    <div class="num-pinyin">yī</div>
    <div class="num-char">一</div>
    <div class="num-meaning">một</div>
  </div>
  <div class="num-card">
    <div class="num-pinyin">wǔ</div>
    <div class="num-char">五</div>
    <div class="num-meaning">năm</div>
  </div>
  <div class="num-card">
    <div class="num-pinyin">bā</div>
    <div class="num-char">八</div>
    <div class="num-meaning">tám</div>
  </div>
</div>
</body>
</html>
