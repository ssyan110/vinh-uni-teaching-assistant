<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bài 1 · 你好 · Xin chào</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; background: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 32px 24px; }
.header { text-align: center; margin-bottom: 24px; }
.header h1 { font-size: 22pt; color: #1A3A5A; font-weight: 700; }
.header .subtitle { font-size: 12pt; color: #8A9AB0; margin-top: 4px; }
.viewer { position: relative; }
.viewer iframe { width: 960px; height: 540px; border: none; border-radius: 12px; box-shadow: 0 4px 24px rgba(90,172,172,0.10); display: block; }
.controls { display: flex; align-items: center; gap: 16px; margin-top: 20px; justify-content: center; }
.btn { background: #5AACAC; color: #fff; border: none; padding: 10px 24px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; transition: opacity 0.2s; }
.btn:hover { opacity: 0.85; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.counter { font-size: 14px; color: #8A9AB0; min-width: 60px; text-align: center; }
</style>
</head>
<body>
<div class="header">
  <h1>Bài 1 · 你好 · Xin chào</h1>
  <div class="subtitle">29 slides</div>
</div>
<div class="viewer">
  <iframe id="slideFrame" src="01-cover.html"></iframe>
</div>
<div class="controls">
  <button class="btn" id="prevBtn" onclick="prev()">← Prev</button>
  <span class="counter" id="counter">1 / 28</span>
  <button class="btn" id="nextBtn" onclick="next()">Next →</button>
</div>

<script>
const MANIFEST = [
  '01-cover.html',
  '02-objectives.html',
  '03-warmup.html',
  '04-divider-vocab.html',
  '05-vocab-ni.html',
  '06-vocab-hao.html',
  '07-vocab-nihao.html',
  '08-vocab-numbers.html',
  '09-vocab-da.html',
  '10-vocab-bu.html',
  '11-vocab-kou.html',
  '12-vocab-bai.html',
  '13-vocab-nu.html',
  '14-vocab-ma.html',
  '15-examples.html',
  '16-vocab-summary.html',
  '17-divider-text.html',
  '18-dialogue.html',
  '19-divider-practice.html',
  '20-practice-flashcards.html',
  '21-practice-numbers.html',
  '22-practice-negation.html',
  '23-practice-blooket.html',
  '24-divider-culture.html',
  '25-culture-greetings.html',
  '26-divider-exercises.html',
  '27-exercises-list.html',
  '28-homework.html',
  '29-closing.html'
];

let current = 0;
const frame = document.getElementById('slideFrame');
const counter = document.getElementById('counter');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

function update() {
  frame.src = MANIFEST[current];
  counter.textContent = (current + 1) + ' / ' + MANIFEST.length;
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === MANIFEST.length - 1;
}

function prev() { if (current > 0) { current--; update(); } }
function next() { if (current < MANIFEST.length - 1) { current++; update(); } }

document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowLeft') prev();
  if (e.key === 'ArrowRight') next();
});

update();
</script>
</body>
</html>
