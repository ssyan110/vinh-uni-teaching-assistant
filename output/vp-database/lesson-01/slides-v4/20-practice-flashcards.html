<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=960, height=540">
<title>Bài 1 · Ghép thẻ</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; width: 960px; height: 540px; overflow: hidden; position: relative; background: #FFFFFF; padding: 48px 60px; display: flex; flex-direction: column; }
.menu-bar { position: absolute; top: 0; left: 0; right: 0; height: 36px; background: rgba(255,255,255,0.88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.06); display: flex; align-items: center; padding: 0 28px; z-index: 10; }
.menu-bar .dot { width: 8px; height: 8px; border-radius: 50%; background: #8B5CF6; margin-right: 10px; }
.menu-bar .section-label { font-size: 9pt; font-weight: 600; color: #4A6080; text-transform: uppercase; letter-spacing: 1px; }
.page-indicator { position: absolute; bottom: 16px; right: 28px; font-size: 9pt; color: #8A9AB0; }
h1 { font-size: 20pt; color: #1A3A5A; font-weight: 700; margin-top: 8px; }
.instruction { font-size: 12pt; color: #8A9AB0; margin-top: 6px; margin-bottom: 28px; }
.columns { display: flex; gap: 60px; flex: 1; align-items: center; justify-content: center; }
.column { display: flex; flex-direction: column; gap: 20px; align-items: center; }
.col-header { font-size: 10pt; text-transform: uppercase; letter-spacing: 1px; color: #8A9AB0; font-weight: 600; margin-bottom: 4px; }
.match-card { width: 160px; height: 56px; display: flex; align-items: center; justify-content: center; background: #F8FCFC; border: 1px solid #E0ECEC; border-radius: 12px; }
.match-card.hanzi { font-family: 'Noto Sans SC', sans-serif; font-weight: 700; font-size: 22pt; color: #1A3A5A; }
.match-card.pinyin { font-size: 15pt; color: #5AACAC; font-weight: 500; }
.match-card.viet { font-size: 14pt; color: #4A6080; }
</style>
</head>
<body>
<div class="menu-bar"><span class="dot"></span><span class="section-label">LUYỆN TẬP</span></div>
<div class="page-indicator">20 / 29</div>
<h1>Ghép thẻ từ vựng</h1>
<div class="instruction">Nối chữ Hán với pinyin và nghĩa tiếng Việt tương ứng</div>
<div class="columns">
  <div class="column">
    <div class="col-header">Hán tự</div>
    <div class="match-card hanzi">马</div>
    <div class="match-card hanzi">你</div>
    <div class="match-card hanzi">好</div>
  </div>
  <div class="column">
    <div class="col-header">Pinyin</div>
    <div class="match-card pinyin">hǎo</div>
    <div class="match-card pinyin">mǎ</div>
    <div class="match-card pinyin">nǐ</div>
  </div>
  <div class="column">
    <div class="col-header">Nghĩa</div>
    <div class="match-card viet">bạn</div>
    <div class="match-card viet">ngựa</div>
    <div class="match-card viet">tốt</div>
  </div>
</div>
</body>
</html>
